<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FP合格ドリル</title>
<meta name="description" content="FP技能士2級・1級の問題を選択肢方式と一問一答で解ける問題集アプリ">
<meta name="theme-color" content="#24508f">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FPドリル">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow study column, bottom tab bar on phones (top on wide screens) */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e9edf2; --ink:#1c2533; --muted:#5a6577; --line:#d6dce5;
  --accent:#24508f; --accent-ink:#ffffff; --accent-soft:#dfe8f5; --mark:#f3d27a;
  --ok:#2a8550; --ok-soft:#e1f1e6; --ng:#c2463a; --ng-soft:#f8e3df;
  --f-head:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141b; --surface:#181e28; --sunk:#141922; --ink:#e4e9f1; --muted:#9aa5b6; --line:#2a3342;
  --accent:#7fa8e6; --accent-ink:#0c1626; --accent-soft:#1f2f4a; --mark:#8a6d1f;
  --ok:#6cce8e; --ok-soft:#1b3326; --ng:#f07c70; --ng-soft:#3a201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --surface:#181e28; --sunk:#141922; --ink:#e4e9f1; --muted:#9aa5b6; --line:#2a3342;
  --accent:#7fa8e6; --accent-ink:#0c1626; --accent-soft:#1f2f4a; --mark:#8a6d1f;
  --ok:#6cce8e; --ok-soft:#1b3326; --ng:#f07c70; --ng-soft:#3a201d; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(88px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;line-height:1.35;margin:0}
h1{font-size:1.3rem}
h2{font-size:1.15rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.top small{color:var(--muted);font-size:.8rem}
.sync{font-size:.75rem;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:640px}
nav.tabs button{position:relative}nav.tabs .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0}
.streak{display:flex;align-items:center;gap:12px}
.streak .fire{font-size:2.2rem;line-height:1}
.streak .big{font-family:var(--f-head);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.streak .sub{font-size:.8rem;color:var(--muted)}
.streak .bc{margin-left:auto;text-align:center;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:6px 10px;cursor:pointer;font:inherit;color:inherit}
.streak .bc b{display:block;font-family:var(--f-head);font-size:1.15rem}
.streak .bc span{font-size:.7rem;color:var(--muted);white-space:nowrap}
.wrap1 td:first-child{white-space:normal}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;line-height:1.35}
.bdg .e{font-size:1.9rem;display:block;line-height:1.2}
.bdg b{display:block;font-size:.78rem}
.bdg span{display:block;font-size:.66rem;color:var(--muted)}
.bdg.off .e{filter:grayscale(1);opacity:.35}
.bdg.off b{color:var(--muted)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:700;text-align:center;max-width:92vw}
.toast .e{font-size:1.6rem;display:block}
.mockbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.mockbar .tm{font-family:var(--f-head);font-weight:700;font-size:1.1rem;color:var(--ink);font-variant-numeric:tabular-nums}
.mockbar .tm.low{color:var(--ng)}
.qgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.qgrid button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 0;font-size:.72rem;cursor:pointer;font-variant-numeric:tabular-nums}
.qgrid button.done{background:var(--accent-soft);border-color:var(--accent)}
.qgrid button.cur{outline:2px solid var(--accent)}
.qgrid button.ok{background:var(--ok-soft);border-color:var(--ok)}
.qgrid button.ng{background:var(--ng-soft);border-color:var(--ng)}
.pass{font-family:var(--f-head);font-size:2rem;font-weight:700;text-align:center}
.pass.ok{color:var(--ok)}.pass.ng{color:var(--ng)}
details.rv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
details.rv summary{cursor:pointer;font-size:.9rem;line-height:1.5}
details.rv[open] summary{margin-bottom:8px}
.rk .nm small{display:block;font-size:.72rem;color:var(--muted);font-weight:400}
.rk{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.rk li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.rk li.me{border:2px solid var(--accent);background:var(--accent-soft)}
.rk .no{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--sunk);font-variant-numeric:tabular-nums}
.rk .no.g1{background:#e9c046;color:#3a2c00}.rk .no.g2{background:#c3c8cc;color:#1e2a27}.rk .no.g3{background:#d39a6a;color:#2f1a08}
.rk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.rk .sc{text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.rk .sc b{font-family:var(--f-head);font-size:1.15rem}
.rk .sc span{display:block;font-size:.72rem;color:var(--muted)}

nav.tabs button{background:none;border:0;padding:6px 2px;border-radius:10px;font-size:.72rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.badge{background:var(--ng);color:#fff;border-radius:999px;font-size:.65rem;padding:0 6px;margin-left:2px}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .lab{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.stat .num{font-family:var(--f-head);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .num small{font-size:.9rem;color:var(--muted);font-weight:500}
.stat.main{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stat.main .lab,.stat.main .num small{color:inherit;opacity:.85}
.field-label{font-size:.8rem;color:var(--muted);margin:0 0 6px;letter-spacing:.04em}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;cursor:pointer}
.mode button b{display:block;font-family:var(--f-head);font-size:1.02rem}
.mode button span{font-size:.78rem;color:var(--muted);line-height:1.4;display:block}
.mode button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:1rem;width:100%}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px}
.row>*{flex:1}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.chip{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.75rem;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.chip.date{background:var(--sunk)}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.stem{font-size:1.05rem;font-weight:500}
.stem b{font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;line-height:1.6}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .n{background:var(--accent);color:var(--accent-ink)}
.res{border-radius:12px;padding:10px 12px;border:1px solid var(--line);background:var(--surface)}
.res.ok{background:var(--ok-soft);border-color:transparent}
.res.ng{background:var(--ng-soft);border-color:transparent}
.res .line{display:flex;gap:6px}
.res .fix{margin-top:4px;font-size:.92rem}
.res .fix b{color:var(--ng)}
.res.ok .fix{color:var(--muted)}
.res .you{font-size:.72rem;color:var(--muted);margin-left:auto;white-space:nowrap}
.verdict{font-family:var(--f-head);font-size:1.15rem;font-weight:700}
.verdict .v-ok{color:var(--ok)} .verdict .v-ng{color:var(--ng)}
.point{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:.93rem}
.point b{font-family:var(--f-head)}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox button{font-family:var(--f-head);font-size:2.2rem;font-weight:700;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;cursor:pointer;line-height:1.2}
.ox button span{display:block;font-size:.8rem;font-family:var(--f-body);color:var(--muted);font-weight:500}
.term{background:linear-gradient(transparent 62%,var(--mark) 62%);border:0;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:inherit;display:inline}
.list{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.item{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.item .meta{display:flex;gap:6px;align-items:center;font-size:.75rem;color:var(--muted)}
.item .t{font-size:.93rem;line-height:1.5}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:.92rem}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.75rem;color:var(--muted);font-weight:500}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;margin-left:6px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .b{fill:var(--accent)}
.chart .lbl{fill:var(--ink);font-size:10px;font-weight:700}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink)}
dl.gl{margin:0;display:flex;flex-direction:column;gap:10px}
dl.gl div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
dl.gl dt{font-family:var(--f-head);font-weight:700}
dl.gl dd{margin:2px 0 0;font-size:.92rem;color:var(--ink)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet h3{font-size:1.15rem;margin-bottom:6px}
.sheet p{margin:0 0 14px}
.note{font-size:.8rem;color:var(--muted)}
.twocol{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--sunk);border-radius:10px;padding:8px;text-align:center}
.mini b{display:block;font-family:var(--f-head);font-size:1.2rem;font-variant-numeric:tabular-nums}
.mini span{font-size:.72rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.fade{animation:fd .2s ease-out}@keyframes fd{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div><h1>FP合格ドリル</h1><small>FP技能士 2級・1級 ・ 全<span id="qcount">0</span>問</small></div>
    <span class="sync" id="sync">読み込み中…</span>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="メニュー"><div class="in">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
  <button data-tab="quiz"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>解く</button>
  <button data-tab="miss"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg><span>間違えた<span id="missBadge"></span></span></button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>成績</button>
  <button data-tab="words"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>用語</button>

<script id="data" type="application/json">{"questions":[{"id":"L2-01","lv":"2","field":"ライフプランニングと資金計画","topic":"FPと関連法規","kind":"不適切","opts":["金融商品取引業の登録を受けていないFPが、顧客と投資顧問契約を結んで具体的な投資判断の助言をすることは、金融商品取引法に抵触しない。","保険募集人の登録を受けていないFPが、生命保険の一般的な仕組みを説明することは、保険業法に抵触しない。","税理士資格を持たないFPが、無償であっても顧客の個別具体的な税額計算を行うことは、税理士法に抵触する。","弁護士資格を持たないFPが、遺言の一般的な仕組みを説明することは、弁護士法に抵触しない。"],"tf":[false,true,true,true],"exp":["投資助言・代理業の登録が必要なので抵触する。","募集（勧誘）をしなければOK。","税理士業務は有償・無償を問わず税理士だけができる。","一般的な説明はOK。個別の法律判断はNG。"],"ans":[1],"point":"個別の税務・法律判断、投資助言、保険募集は資格や登録が必要。一般的な説明ならOK。","weak":false,"date":"新作"},{"id":"L2-02","lv":"2","field":"ライフプランニングと資金計画","topic":"6つの係数","kind":"適切","opts":["毎年一定額を受け取るために必要な元本は、受取額に資本回収係数を掛けて求める。","現在の元本を運用しながら毎年取り崩せる額は、元本に年金現価係数を掛けて求める。","現在の元本を複利で運用した将来の額は、元本に年金終価係数を掛けて求める。","一定期間後に目標額を貯めるために毎年積み立てる額は、目標額に減債基金係数を掛けて求める。"],"tf":[false,false,false,true],"exp":["必要な元本は年金現価係数。","毎年の取崩額は資本回収係数。","元本の将来額は終価係数。年金終価係数は毎年の積立額の将来額。",""],"ans":[4],"point":"終価＝元本の将来／現価＝将来額の今の価値／年金終価＝積立の将来／減債基金＝目標への積立額／資本回収＝元本からの取崩額／年金現価＝取崩しに必要な元本","weak":true,"date":"新作"},{"id":"L2-03","lv":"2","field":"ライフプランニングと資金計画","topic":"6つの係数の計算","kind":"適切","opts":["同じ条件で、毎年の受取額は50万円である。","同じ条件で、毎年の受取額は45万6,500円である。","500万円を年2％で運用しながら10年間毎年均等に取り崩す場合（資本回収係数0.1113）、毎年の受取額は55万6,500円である。","同じ条件で、毎年の受取額は60万9,500円である。"],"tf":[false,false,true,false],"exp":["50万円は運用を考えない単純な割り算。","500万円×0.1113で計算する。","500万円×0.1113＝55万6,500円。","計算違い。500万円×0.1113＝55万6,500円。"],"ans":[3],"point":"「元本を取り崩す」と出たら資本回収係数。","weak":true,"date":"新作"},{"id":"L2-04","lv":"2","field":"ライフプランニングと資金計画","topic":"傷病手当金","kind":"不適切","opts":["支給額は1日につき、支給開始日以前12か月の標準報酬月額の平均の30分の1の3分の2相当額である。","傷病手当金は、連続3日間の待期期間を経て、4日目から支給される。","市町村の国民健康保険にも、傷病手当金の支給が法律で義務付けられている。","支給期間は、支給開始日から通算して1年6か月である。"],"tf":[true,true,false,true],"exp":["","","国民健康保険では任意給付で、ほとんど実施されていない。",""],"ans":[3],"point":"待期3日（連続）→4日目から、標準報酬日額の2/3、通算1年6か月。","weak":true,"date":"新作"},{"id":"L2-05","lv":"2","field":"ライフプランニングと資金計画","topic":"高額療養費","kind":"不適切","opts":["差額ベッド代や入院時の食事代の自己負担分も、高額療養費の対象となる。","70歳未満の人の世帯合算では、1件あたり21,000円以上の自己負担額が合算の対象となる。","あらかじめ限度額適用認定証（またはマイナ保険証）を使えば、窓口での支払いを限度額までにできる。","直近12か月で3回以上該当した場合、4回目からは多数回該当として自己負担限度額が下がる。"],"tf":[false,true,true,true],"exp":["差額ベッド代・食事代・先進医療の技術料は対象外。","","",""],"ans":[1],"point":"対象は保険診療の自己負担分だけ。差額ベッド代や食事代は対象外。","weak":false,"date":"新作"},{"id":"L2-06","lv":"2","field":"ライフプランニングと資金計画","topic":"任意継続被保険者","kind":"適切","opts":["任意継続被保険者として加入できる期間は、最長3年である。","任意継続被保険者の保険料は、退職前と同じく事業主と折半で負担する。","任意継続中に新たに病気になった場合も、傷病手当金が支給される。","任意継続被保険者になるには、資格喪失日の前日まで継続して2か月以上の被保険者期間が必要で、喪失日から20日以内に申し出る。"],"tf":[false,false,false,true],"exp":["最長2年。","全額自己負担。","原則として傷病手当金・出産手当金は支給されない。",""],"ans":[4],"point":"任意継続＝2か月以上加入・20日以内に申出・最長2年・保険料は全額自己負担。","weak":false,"date":"新作"},{"id":"L2-07","lv":"2","field":"ライフプランニングと資金計画","topic":"後期高齢者医療制度","kind":"不適切","opts":["保険料は、年金が年18万円以上の場合は原則として年金から天引きされる。","75歳以上の人（一定の障害がある65歳以上の人を含む）が被保険者となる。","自己負担は原則1割で、一定以上の所得がある人は2割、現役並み所得者は3割である。","運営主体は、被保険者が住む市町村である。"],"tf":[true,true,true,false],"exp":["","","","都道府県ごとの後期高齢者医療広域連合が運営する。"],"ans":[4],"point":"運営は都道府県単位の広域連合。","weak":false,"date":"新作"},{"id":"L2-08","lv":"2","field":"ライフプランニングと資金計画","topic":"公的介護保険","kind":"適切","opts":["第2号被保険者は、40歳以上65歳未満の医療保険加入者である。","第2号被保険者は、原因を問わず要介護状態になれば給付を受けられる。","第1号被保険者の保険料は、全員が年金から天引きされる。","介護サービスの自己負担は、所得にかかわらず1割である。"],"tf":[true,false,false,false],"exp":["","特定疾病（16種類）が原因の場合に限られる。","年金が年18万円以上の人が特別徴収（天引き）。","第1号被保険者は所得により1〜3割。"],"ans":[1],"point":"第2号は特定疾病のときだけ給付。","weak":false,"date":"新作"},{"id":"L2-09","lv":"2","field":"ライフプランニングと資金計画","topic":"労災保険","kind":"不適切","opts":["労災保険の保険料は、全額を事業主が負担する。","休業補償給付は、休業4日目から給付基礎日額の60％相当額が支給される。","会社の役員や個人事業主は、どのような場合でも労災保険に加入できない。","通勤途上の負傷も、労災保険の給付の対象となる。"],"tf":[true,true,false,true],"exp":["","特別支給金20％と合わせて80％。","特別加入制度で加入できる場合がある。",""],"ans":[3],"point":"労災保険料は全額事業主負担。役員・自営業者は特別加入できる。","weak":false,"date":"新作"},{"id":"L2-10","lv":"2","field":"ライフプランニングと資金計画","topic":"雇用保険の基本手当","kind":"適切","opts":["自己都合で離職した人で、被保険者期間が20年以上の場合、所定給付日数は150日である。","基本手当の受給要件は、原則として離職前1年間に被保険者期間が6か月以上あることである。","自己都合で離職した場合の給付制限期間は、原則として3か月である。","基本手当の受給期間は、原則として離職日の翌日から2年間である。"],"tf":[true,false,false,false],"exp":["","原則は離職前2年間に12か月以上（倒産・解雇等は1年間に6か月以上）。","2025年4月から原則1か月（5年間で3回以上の自己都合離職なら3か月）。","原則1年間。"],"ans":[1],"point":"受給期間1年、自己都合の給付制限は原則1か月（2025年4月〜）。","weak":true,"date":"新作"},{"id":"L2-11","lv":"2","field":"ライフプランニングと資金計画","topic":"育児休業給付","kind":"不適切","opts":["育児休業給付金は、自営業者（国民年金第1号被保険者）も受け取ることができる。","育児休業給付は雇用保険から支給される。","育児休業給付金は、休業開始から180日目までは休業開始時賃金日額の67％相当額である。","育児休業給付金は、181日目以降は50％相当額となる。"],"tf":[false,true,true,true],"exp":["雇用保険の被保険者が対象。自営業者は対象外。","","",""],"ans":[1],"point":"180日まで67％、その後50％。雇用保険の被保険者が対象。","weak":false,"date":"新作"},{"id":"L2-12","lv":"2","field":"ライフプランニングと資金計画","topic":"国民年金の被保険者","kind":"適切","opts":["第3号被保険者は、第2号被保険者に扶養される配偶者で、20歳以上60歳未満の人である。","第1号被保険者は、20歳以上65歳未満の自営業者などである。","会社員は、年齢にかかわらず70歳になるまで第2号被保険者となる。","学生納付特例は、世帯主の所得で判定される。"],"tf":[true,false,false,false],"exp":["","20歳以上60歳未満。","65歳以上で老齢年金の受給権がある人は第2号被保険者ではない。","学生本人の所得で判定する（免除は本人・世帯主・配偶者）。"],"ans":[1],"point":"第1号・第3号は20歳以上60歳未満。学生納付特例は本人の所得だけで判定。","weak":false,"date":"新作"},{"id":"L2-13","lv":"2","field":"ライフプランニングと資金計画","topic":"老齢基礎年金の繰上げ・繰下げ","kind":"適切","opts":["老齢基礎年金の繰下げは、老齢厚生年金と同時でなければならない。","繰下げ受給は最長75歳まででき、1か月あたり0.7％増額される。","老齢基礎年金の繰上げは、老齢厚生年金と別々に請求できる。","繰上げ受給をすると、1か月あたり0.5％減額される。"],"tf":[false,true,false,false],"exp":["繰下げは別々にできる。","75歳まで繰り下げると84％増。","繰上げは老齢厚生年金と同時に請求する。","1962年4月2日以後生まれは0.4％（最大24％減）。"],"ans":[2],"point":"繰上げ＝同時に・月0.4％減／繰下げ＝別々OK・月0.7％増・最長75歳（84％増）。","weak":true,"date":"新作"},{"id":"L2-14","lv":"2","field":"ライフプランニングと資金計画","topic":"老齢基礎年金","kind":"不適切","opts":["保険料の全額免除期間（2009年4月以後）は、年金額の計算で2分の1として反映される。","老齢基礎年金の受給資格期間は10年である。","合算対象期間（カラ期間）は、年金額の計算にも反映される。","20歳から60歳までの480月すべて保険料を納付すると、満額の老齢基礎年金を受け取れる。"],"tf":[true,true,false,true],"exp":["","2017年8月から25年→10年に短縮。","カラ期間は受給資格期間には入るが、年金額には反映されない。",""],"ans":[3],"point":"受給資格10年。カラ期間は資格期間だけに数える。","weak":true,"date":"新作"},{"id":"L2-15","lv":"2","field":"ライフプランニングと資金計画","topic":"付加年金","kind":"適切","opts":["付加年金と国民年金基金は、同時に加入できる。","老齢基礎年金を繰り下げても、付加年金は増額されない。","第3号被保険者も付加保険料を納付できる。","付加保険料は月400円で、付加年金の年額は200円×付加保険料納付月数である。"],"tf":[false,false,false,true],"exp":["同時加入はできない。","付加年金も繰下げに合わせて増額される。","第1号被保険者と任意加入者だけ。","2年受け取れば元が取れる。"],"ans":[4],"point":"付加年金＝400円払って200円×月数がもらえる。国民年金基金とは併用不可。","weak":false,"date":"新作"},{"id":"L2-16","lv":"2","field":"ライフプランニングと資金計画","topic":"老齢厚生年金","kind":"不適切","opts":["2026年度の在職老齢年金では、基本月額と総報酬月額相当額の合計が65万円を超えると、超えた額の2分の1が支給停止となる。","在職老齢年金の仕組みにより、老齢基礎年金も支給停止されることがある。","加給年金は、厚生年金の加入期間が20年以上あり、生計を維持する65歳未満の配偶者などがいる場合に加算される。","65歳からの老齢厚生年金は、老齢基礎年金の受給資格を満たし、厚生年金の加入期間が1か月以上あれば受け取れる。"],"tf":[true,false,true,true],"exp":["2026年4月から基準額が51万円→65万円に上がった。","止まるのは老齢厚生年金だけ。老齢基礎年金は全額出る。","",""],"ans":[2],"point":"在職老齢年金の基準額は2026年度65万円。止まるのは厚生年金だけ。","weak":false,"date":"新作"},{"id":"L2-17","lv":"2","field":"ライフプランニングと資金計画","topic":"遺族年金","kind":"適切","opts":["遺族厚生年金の額は、死亡した人の老齢厚生年金の報酬比例部分の3分の2である。","遺族基礎年金を受け取れるのは、子のある配偶者または子である。","子のない30歳未満の妻が受け取る遺族厚生年金は、終身で支給される。","遺族基礎年金の「子」とは、20歳未満の子をいう。"],"tf":[false,true,false,false],"exp":["4分の3。","","5年間の有期年金。","18歳到達年度の末日まで（障害1・2級なら20歳未満）。"],"ans":[2],"point":"遺族基礎年金＝子のある配偶者か子。遺族厚生年金＝報酬比例の3/4。","weak":false,"date":"新作"},{"id":"L2-18","lv":"2","field":"ライフプランニングと資金計画","topic":"障害年金","kind":"適切","opts":["障害基礎年金1級の額は、2級の1.25倍である。","障害基礎年金には1級から3級まである。","障害厚生年金は、被保険者期間が300月未満なら実際の月数で計算する。","障害認定日は、原則として初診日から1年を経過した日である。"],"tf":[true,false,false,false],"exp":["","障害基礎年金は1級・2級だけ。3級と障害手当金は厚生年金だけ。","300月未満は300月とみなして計算する。","初診日から1年6か月を経過した日（その前に治ればその日）。"],"ans":[1],"point":"障害基礎は1・2級（1級は2級の1.25倍）、障害厚生は1〜3級＋障害手当金。300月みなし。","weak":true,"date":"新作"},{"id":"L2-19","lv":"2","field":"ライフプランニングと資金計画","topic":"iDeCo（個人型確定拠出年金）","kind":"不適切","opts":["企業年金のない会社員の拠出限度額は、月23,000円である。","掛金は全額が小規模企業共済等掛金控除の対象となる。","60歳時点で通算加入者等期間が10年未満でも、60歳から老齢給付金を受け取れる。","自営業者の拠出限度額は、国民年金基金等と合算で月68,000円である。"],"tf":[true,true,false,true],"exp":["","","10年未満だと受給開始が遅くなる（例：8年以上10年未満は61歳から）。",""]," 画","topic":"キャッシュフロー表","kind":"適切","opts":["個人バランスシートの資産は、取得したときの価格で計上する。","金融資産残高は、「前年末残高×（1＋運用利率）−その年の年間収支」で求める。","将来の収入や支出の額は、「現在の額×（1＋変動率）^経過年数」で求める。","可処分所得は、年収から所得税・住民税・社会保険料・生命保険料を差し引いて求める。"],"tf":[false,false,true,false],"exp":["時価で計上する。","年間収支は足す（＋）。","","生命保険料は引かない。"],"ans":[3],"point":"可処分所得＝年収−（所得税＋住民税＋社会保険料）。","weak":false,"date":"新作"},{"id":"L2-26","lv":"2","field":"ライフプランニングと資金計画","topic":"国民年金保険料","kind":"不適切","opts":["保険料の免除を受けた期間の分は、10年以内なら追納できる。","学生納付特例の期間は、追納しなくても老齢基礎年金の額に反映される。","第1号被保険者の産前産後期間（出産予定月の前月から4か月）は保険料が免除され、年金額は満額として計算される。","保険料を前納すると、割引が受けられる。"],"tf":[true,false,true,true],"exp":["","学生納付特例・納付猶予は追納しないと年金額に反映されない。","",""],"ans":[2],"point":"学生納付特例は資格期間には入るが、追納しないと年金額はゼロ。","weak":false,"date":"新作"},{"id":"L2-27","lv":"2","field":"ライフプランニングと資金計画","topic":"公的年金と税金","kind":"適切","opts":["公的年金等控除の額は、年齢にかかわらず同じである。","遺族年金は、雑所得として所得税の課税対象となる。","障害年金は、一時所得として所得税の課税対象となる。","老齢年金は、雑所得として所得税の課税対象となる。"],"tf":[false,false,false,true],"exp":["65歳未満と65歳以上で異なる。","遺族年金・障害年金は非課税。","非課税。",""],"ans":[4],"point":"老齢年金は雑所得、遺族年金・障害年金は非課税。","weak":false,"date":"新作"},{"id":"L2-28","lv":"2","field":"ライフプランニングと資金計画","topic":"決算書の読み方","kind":"適切","opts":["流動比率は、流動負債÷流動資産×100で求める。","営業利益に営業外収益を加え、営業外費用を差し引いたものが、税引前当期純利益である。","売上高から売上原価を差し引いたものが、売上総利益（粗利）である。","自己資本比率は、低いほど安全性が高い。"],"tf":[false,false,true,false],"exp":["流動資産÷流動負債×100。","それは経常利益。特別損益を加減して税引前当期純利益。","","高いほど安全性が高い。"],"ans":[3],"point":"売上総利益→営業利益→経常利益→税引前当期純利益→当期純利益。","weak":false,"date":"新作"},{"id":"L2-29","lv":"2","field":"ライフプランニングと資金計画","topic":"消費者ローン・クレジット","kind":"不適切","opts":["リボルビング払いは、利用額にかかわらず毎月ほぼ一定額を返済する方式である。","総量規制は、銀行のカードローンには適用されない。","クレジットカードのショッピング利用額も、総量規制の対象となる。","貸金業法の総量規制では、年収の3分の1を超える貸付けが原則禁止される。"],"tf":[true,true,false,true],"exp":["","","ショッピングは割賦販売法の対象で、総量規制の対象外。",""],"ans":[3],"point":"総量規制は貸金業者のキャッシング・ローンが対象。","weak":false,"date":"新作"},{"id":"L2-30","lv":"2","field":"ライフプランニングと資金計画","topic":"国民年金の任意加入","kind":"適切","opts":["任意加入者は付加保険料を納付できない。","60歳以上65歳未満で老齢基礎年金が満額に満たない人は 者給付金が一時金で支給される。","高年齢求職者給付金を受けると、老齢厚生年金は支給停止される。"],"tf":[false,false,true,false],"exp":["最高10％に縮小された。","求職の申込みをすると年金は支給停止となる。","","年金と併給できる。"],"ans":[3],"point":"65歳以上は一時金で年金と併給可。65歳未満の基本手当は年金と併給不可。","weak":false,"date":"新作"},{"id":"R2-01","lv":"2","field":"リスク管理","topic":"保険契約者保護機構","kind":"適切","opts":["少額短期保険業者の契約も、保険契約者保護機構の補償の対象となる。","生命保険会社が破綻した場合、原則として破綻時点の責任準備金等の90％までが補償される。","自賠責保険の補償割合は80％である。","銀行の窓口で加入した保険は、預金保険制度で保護される。"],"tf":[false,true,false,false],"exp":["少額短期保険は対象外。","高予定利率契約は除く。","自賠責・地震保険は100％。","保険契約者保護機構の対象。預金保険ではない。"],"ans":[2],"point":"生保は責任準備金等の90％。損保は自賠責・地震100％、火災などは破綻後3か月100％・以後80％。","weak":true,"date":"新作"},{"id":"R2-02","lv":"2","field":"リスク管理","topic":"クーリング・オフ","kind":"不適切","opts":["申込日または契約内容を記載した書面の受領日のいずれか遅い日から8日以内なら、申込みの撤回ができる。","クーリング・オフは、書面または電磁的記録で行う。","医師の診査が終了した後でも、クーリング・オフはできる。","保険期間が1年以内の契約は、クーリング・オフの対象外である。"],"tf":[true,true,false,true],"exp":["","","診査終了後はできない。",""],"ans":[3],"point":"遅い日から8日以内・書面等で。1年以内の契約、診査終了後、法人契約は不可。","weak":true,"date":"新作"},{"id":"R2-03","lv":"2","field":"リスク管理","topic":"生命保険料のしくみ","kind":"適切","opts":["死亡保険で予定死亡率を高く見積もると、保険料は安くなる。","予定事業費率を高く設定すると、保険料は安くなる。","利差益とは、予定事業費と実際の事業費との差から生じる利益である。","予定利率を低く設定すると、保険料は高くなる。"],"tf":[false,false,false,true],"exp":["高くなる。","高くなる。","それは費差益。利差益は予定利率と実際の運用利回りの差。",""],"ans":[4],"point":"予定利率↓→保険料↑。剰余金は死差益・利差益・費差益。","weak":false,"date":"新作"},{"id":"R2-04","lv":"2","field":"リスク管理","topic":"生命保険の種類","kind":"不適切","opts":["養老保険は、死亡保険金と満期保険金が同額である。","終身型の変額保険の死亡保険金には、最低保証がない。","更新型の定期保険特約は、更新時に保険料が上がる。","収入保障保険の死亡保険金（年金総額）は、時間の経過とともに減少していく。"],"tf":[true,false,true,true],"exp":["","基本保険金額が最低保証される（解約返戻金には保証なし）。","",""],"ans":[2],"point":"変額保険は死亡保険金に最低保証あり、解約返戻金・満期保険金は保証なし。","weak":false,"date":"新作"},{"id":"R2-05","lv":"2","field":"リスク管理","topic":"保険料が払えないときの対応","kind":"適切","opts":["失効した契約を復活させる場合、告知は不要である。","延長保険に変更すると、保険期間が元の契約より長くなることがある。","払済保険に変更すると、保険期間は変わらず保険金額が小さくなり、特約もそのまま続く。","自動振替貸付は、解約返戻金の範囲内で保険会社が保険料を立て替える制度である。"],"tf":[false,false,false,true],"exp":["告知（診査）が必要で、延滞保険料もまとめて払う。","元の保険期間を超えない。","特約は消滅する（リビング・ニーズ特約などを除く）。",""],"ans":[4],"point":"払済＝期間同じ・金額↓・特約消滅。延長＝金額同じ・期間↓（元の期間を超えない）。","weak":false,"date":"新作"},{"id":"R2-06","lv":"2","field":"リスク管理","topic":"生命保険料控除","kind":"適切","opts":["住民税の生命保険料控除の上限は、合計12万円である。","2012年以降の契約では、一般・介護医療・個人年金の3つで各4万円、合計12万円が所得税の上限である。","個人年金保険料税制適格特約が付いていない個人年金保険も、個人年金保険料控除の対象となる。","2012年以降の契約では、災害割増特約の保険料も控除の対象となる。"],"tf":[false,true,false,false],"exp":["住民税は合計7万円。","","特約がなければ一般の生命保険料控除。","傷害特約・災害割増特約は対象外。"],"ans":[2],"point":"新制度：所得税は各4万・合計12万、住民税は各2.8万・合計7万。","weak":true,"date":"新作"},{"id":"R2-07","lv":"2","field":"リスク管理","topic":"死亡保険金の課税","kind":"適切","opts":["相続を放棄した人が受け取った死亡保険金にも、「500万円×法定相続人の数」の非課税枠が使える。","契約者が夫、被保険者が妻、受取人が子の死亡保険金は、相続税の対象となる。","契約者（保険料負担者）と被保険者が夫、受取人が妻の死亡保険金は、相続税の対象となる。","契約者と受取人が妻、被保険者が夫の死亡保険金は、贈与税の対象となる。"],"tf":[false,false,true,false],"exp":["受け取れるが、非課税枠は使えない。","贈与税。","","所得税・住民税（一時所得）。"],"ans":[3],"point":"契約者＝被保険者→相続税／契約者＝受取人→所得税／全員バラバラ→贈与税。","weak":true,"date":"新作"},{"id":"R2-08","lv":"2","field":"リスク管理","topic":"個人年金保険","kind":"不適切","opts":["確定年金は、被保険者の生死にかかわらず一定期間、年金が支払われる。","有期年金は、被保険者が生きている場合に限り一定期間、年金が支払われる。","年金受取時に毎年受け取る年金は、一時所得となる。","保証期間付終身年金は、保証期間中に死亡すると残りの期間分が遺族に支払われる。"],"tf":[true,true,false,true],"exp":["","","雑所得。",""],"ans":[3],"point":"毎年の年金＝雑所得。","weak":false,"date":"新作"},{"id":"R2-09","lv":"2","field":"リスク管理","topic":"法人契約の生命保険","kind":"適切","opts":["ハーフタックスプランの養老保険の保険料は、全額損金に算入できる。","法人が受け取った死亡保険金は、非課税である。","法人が契約者・死亡保険金受取人の終身保険の保険料は、全額資産計上する。","最高解約返戻率が50％以下の定期保険の保険料は、全額資産計上する。"],"tf":[false,false,true,false],"exp":["2分の1資産計上、2分の1損金。","益金（資産計上額との差額は雑収入など）。","","全額損金。"],"ans":[3],"point":"終身保険は資産計上、50％以下の定期保険は損金、ハーフタックスは1/2ずつ。","weak":false,"date":"新作"},{"id":"R2-10","lv":"2","field":"リスク管理","topic":"第三分野の保険","kind":"不適切","opts":["先進医療特約の対象は、療養を受けた時点で厚生労働大臣が定める先進医療である。","医療保険の入院給付金には、1入院あたりの支払限度日数がある。","がん保険には、通常90日程度の免責期間（待ち期間）がある。","所得補償保険の保険金は、所得税の課税対象となる。"],"tf":[true,true,true,false],"exp":["契約時点ではない。","","","身体の傷害・病気に基因する保険金なので非課税。"],"ans":[4],"point":"医療・がん・所得補償などの給付金（本人受取）は非課税。","weak":false,"date":"新作"},{"id":"R2-11","lv":"2","field":"リスク管理","topic":"火災保険と失火責任法","kind":"適切","opts":["地震が原因の火災による損害は、火災保険では補償されない。","時価で契約した火災保険で全損になると、再調達価額が支払われる。","借家人が軽過失で借家を焼失させても、家主に対する損害賠償責任は負わない。","失火責任法により、軽過失で隣家を焼失させても損害賠償責任を負う。"],"tf":[true,false,false,false],"exp":["地震保険が必要。","時価が基準。","債務不履行責任で家主には賠償責任を負う。","重過失でなければ隣家への賠償責任は負わない。"],"ans":[1],"point":"隣家には重過失のみ責任、家主には軽過失でも責任（借家人賠償責任保険で備える）。","weak":false,"date":"新作"},{"id":"R2-12","lv":"2","field":"リスク管理","topic":"地震保険","kind":"不適切","opts":["地震保険は単独では加入できず、火災保険に付帯して加入する。","損害の区分は、全損・大半損・小半損・一部損の4区分である。","保険金額は主契約の30〜50％で、建物5,000万円・家財1,000万円が上限である。","地震保険の保険料は、保険会社ごとに大きく異なる。"],"tf":[true,true,true,false],"exp":["","","","同じ条件ならどの保険会社でも同じ。"],"ans":[4],"point":"地震保険＝付帯のみ・30〜50％・建物5,000万・家財1,000万・4区分。","weak":true,"date":"新作"},{"id":"R2-13","lv":"2","field":"リスク管理","topic":"自動車保険","kind":"適切","opts":["人身傷害補償保険の保険金は、自分の過失割合分が差し引かれる。","対人賠償保険では、運転者本人の配偶者のけがも補償される。","自賠責保険は、物損事故の損害も補償する。","自賠責保険の支払限度額は、死亡3,000万円、傷害120万円、後遺障害最高4,000万円である。"],"tf":[false,false,false,true],"exp":["過失割合に関係なく損害額が支払われる。","本人・配偶者・父母・子は免責。","対人のみ。",""],"ans":[4],"point":"自賠責は対人のみ（死亡3,000万・傷害120万）。人身傷害は過失割合に関係なし。","weak":true,"date":"新作"},{"id":"R2-14","lv":"2","field":"リスク管理","topic":"賠償責任保険","kind":"不適切","opts":["施設所有（管理）者賠償責任保険は、施設の欠陥や管理の不備による事故を補償する。","個人賠償責任保険では、自動車事故は補償の対象外である。","生産物賠償責任保険（PL保険）では、製造した製品の欠陥で他人が受けた損害は補償されない。","個人賠償責任保険では、同居の親族の賠償事故も補償される。"],"tf":[true,true,false,true],"exp":["","","まさにそれを補償する保険。","別居の未婚の子も対象。"],"ans":[3],"point":"個人賠償は自動車・業務中・預かり物は対象外。","weak":false,"date":"新作"},{"id":"R2-15","lv":"2","field":"リスク管理","topic":"傷害保険","kind":"適切","opts":["普通傷害保険では、細菌性食中毒は補償されない。","普通傷害保険は、海外での事故を補償しない。","国内旅行傷害保険では、地震・噴火・津波による傷害も補償される。","家族傷害保険の「家族」の範囲は、契約時点で決まる。"],"tf":[true,false,false,false],"exp":["海外旅行傷害保険は補償。","国内外を問わず補償。","国内旅行では対象外（海外旅行は対象）。","事故が起きた時点で判定する。"],"ans":[1],"point":"細菌性食中毒・地震は国内旅行×、海外旅行○。","weak":false,"date":"新作"},{"id":"R2-16","lv":"2","field":"リスク管理","topic":"損害保険と税金","kind":"不適切","opts":["地震保険料控除は、所得税で最高5万円である。","自分の車の事故で受け取った車両保険金は、一時所得となる。","火災保険で受け取った損害保険金は、非課税である。","住民税の地震保険料控除は、保険料の2分の1で最高2万5,000円である。"],"tf":[true,false,true,true],"exp":["","損害を補てんする保険金なので非課税。","",""],"ans":[2],"point":"地震保険料控除：所得税5万・住民税2.5万。","weak":false,"date":"新作"},{"id":"R2-17","lv":"2","field":"リスク管理","topic":"告知義務","kind":"適切","opts":["保険法の告知義務は、契約者が自分から全ての事実を申告する義務である。","告知義務違反があった場合、保険会社が解除できるのは、違反を知った時から1か月以内、かつ契約から5年以内である。","生命保険募集人には、原則として告知受領権がある。","告知義務違反で解除された場合、払い込んだ保険料は全額返還される。"],"tf":[false,true,false,false],"exp":["保険会社が質問したことに答えればよい（質問応答義務）。","","生命保険募集人には原則として告知受領権がない（医師や保険会社にある）。","原則として返還されない（解約返戻金があれば支払われる）。"],"ans":[2],"point":"告知は質問応答義務。解除は知って1か月・契約から5年。","weak":false,"date":"新作"},{"id":"R2-18","lv":"2","field":"リスク管理","topic":"リビング・ニーズ特約など","kind":"不適切","opts":["リビング・ニーズ特約で請求できる額の上限は、3,000万円である。","リビング・ニーズ特約は、保険料の負担なしに付加できる。","指定代理請求特約では、被保険者が請求できない特別な事情があるとき、指定代理請求人が代わりに請求できる。","指定代理請求人が受け取った高度障害保険金は、贈与税の対象となる。"],"tf":[true,true,true,false],"exp":["","","","被保険者本人が受け取ったものとして非課税。"],"ans":[4],"point":"リビング・ニーズは余命6か月・保険料不要・上限3,000万円。","weak":false,"date":"新作"},{"id":"R2-19","lv":"2","field":"リスク管理","topic":"必要保障額","kind":"適切","opts":["遺族の収入見込みには、公的な遺族年金を含めない。","一般に、子が成長するにつれて必要保障額は増えていく。","団体信用生命保険付きの住宅ローン残高は、必要保障額の支出に含める。","必要保障額は、遺族に必要な支出の総額から、遺族の収入見込みの総額を差し引いて求める。"],"tf":[false,false,false,true],"exp":["遺族年金も収入見込みに含める。","通常は減っていく。","団信で完済されるので含めない。",""],"ans":[4],"point":"必要保障額＝支出総額−収入総額（遺族年金も含める）。","weak":false,"date":"新作"},{"id":"R2-20","lv":"2","field":"リスク管理","topic":"少額短期保険","kind":"不適切","opts":["少額短期保険の保険料は、生命保険料控除や地震保険料控除の対象となる。","保険期間の上限は、生命保険・医療保険が1年、損害保険が2年である。","被保険者1人あたりの保険金額の合計は、原則1,000万円が上限である。","少額短期保険は、保険契約者保護機構の対象外である。"],"tf":[false,true,true,true],"exp":["対象外。","","",""],"ans":[1],"point":"少額短期保険は控除対象外・保護機構対象外。","weak":false,"date":"新作"},{"id":"R2-21","lv":"2","field":"リスク管理","topic":"損害保険の支払い方","kind":"適切","opts":["保険金額が保険価額を下回る一部保険では、損害額に「保険金額÷保険価額」の割合を掛けて支払う比例てん補が行われることがある。","再調達価額で契約すると、価値が減った分は自己負担となる。","再調達価額とは、時価から使用による消耗分を差し引いた額である。","保険金額が保険価額を上回る超過保険では、超過部分も含めて保険金が支払われる。"],"tf":[true,false,false,false],"exp":["","再調達価額基準なら新品価格で補償される。","それは時価。再調達価額＝同じものを新たに建て直す・買い直す額。","損害額（保険価額）が上限。"],"ans":[1],"point":"時価＝再調達価額−消耗分。","weak":false,"date":"新作"},{"id":"R2-22","lv":"2","field":"リスク管理","topic":"がん保険","kind":"適切","opts":["がん保険は、死亡保障が主な目的の保険である。","がん保険の入院給付金は、通常、支払日数に限度がない。","がん診断給付金は、上皮内がんでもどの商品でも同額が支払われる。","免責期間中にがんと診断されても、給付金が支払われる。"],"tf":[false,true,false,false],"exp":["がんの治療保障が主。","","商品により減額・対象外がある。","支払われず、契約が無効になるのが一般的。"],"ans":[2],"point":"がん保険＝入院日数無制限・約90日の免責期間。","weak":false,"date":"新作"},{"id":"R2-23","lv":"2","field":"リスク管理","topic":"収入保障保険","kind":"適切","opts":["逓増定期保険は、保険金額が一定で保険料が増えていく保険である。","収入保障保険を年金形式で受け取ると、2年目以降の年金は全額非課税である。","収入保障保険は、同じ保険期間・当初の保険金額の定期保険と比べて、保険料が割安である。","収入保障保険の死亡保険金を一括で受け取ると、年金で受け取る総額より多くなる。"],"tf":[false,false,true,false],"exp":["保険金額が増えていき、保険料は一定。","2年目以降は雑所得（課税部分あり）。初回は相続税。","","一括受取は割り引かれるので少なくなる。"],"ans":[3],"point":"収入保障保険は保障額が減る分、保険料が割安。","weak":false,"date":"新作"},{"id":"R2-24","lv":"2","field":"リスク管理","topic":"団体信用生命保険","kind":"不適切","opts":["住宅ローンの債務者が死亡・高度障害になると、保険金で残りのローンが返済される。","団体信用生命保険の保険料は、生命保険料控除の対象外である。","フラット35の団体信用生命保険は、任意加入である。","団体信用生命保険で返済されたローン残高は、相続人に相続税が課される。"],"tf":[true,true,true,false],"exp":["","","","債務が消えるだけで課税関係は生じない（債務控除もできない）。"],"ans":[4],"point":"団信の保険料は控除対象外。","weak":false,"date":"新作"},{"id":"R2-25","lv":"2","field":"リスク管理","topic":"自動車保険の補償範囲","kind":"適切","opts":["地震・噴火・津波による車の損害は、一般的な車両保険では補償されない。","一般型の車両保険では、単独事故は補償されない。","無保険車傷害保険は、物の損害を補償する。","対物賠償保険は、自分の車の損害を補償する。"],"tf":[true,false,false,false],"exp":["特約が必要。","一般型は補償する（エコノミー型は単独事故を補償しない）。","死亡・後遺障害を補償する。","他人の財物の損害を補償する。"],"ans":[1],"point":"車両保険の地震・津波は特約。エコノミー型は単独事故×。","weak":false,"date":"新作"},{"id":"R2-26","lv":"2","field":"リスク管理","topic":"契約者貸付","kind":"不適切","opts":["返済しないまま死亡した場合、保険金から貸付金と利息が差し引かれる。","契約者貸付は、解約返戻金の一定範囲内で借りられる。","掛け捨ての定期保険でも、必ず契約者貸付を利用できる。","契約者貸付には、所定の利息がかかる。"],"tf":[true,true,false,true],"exp":["","","解約返戻金がない（少ない）保険では利用できない。",""],"ans":[3],"point":"契約者貸付は解約返戻金がある保険だけ。","weak":false,"date":"新作"},{"id":"R2-27","lv":"2","field":"リスク管理","topic":"個人年金保険と税金","kind":"適切","opts":["個人年金保険料税制適格特約を付けるには、年金受取人が契約者またはその配偶者で、かつ被保険者と同一人であることなどが必要である。","年金受取開始前に解約した場合の解約返戻金は、雑所得となる。","契約者と年金受取人が異なる場合でも、年金受取開始時に贈与税はかからない。","個人年金保険の毎年の年金は、全額非課税である。"],"tf":[true,false,false,false],"exp":["払込期間10年以上なども必要。","一時所得。","年金受給権の贈与として贈与税がかかる。","雑所得（年金額−必要経費）。"],"ans":[1],"point":"個人年金：年金は雑所得、解約は一時所得。","weak":false,"date":"新作"},{"id":"R2-28","lv":"2","field":"リスク管理","topic":"法人の保険の経理","kind":"不適切","opts":["法人が契約者・受取人の解約返戻金のない医療保険の保険料は、損金に算入できる。","法人が受け取った解約返戻金は、資産計上額との差額を益金に算入する。","法人が受け取った入院給付金は、非課税である。","役員だけを被保険者とし、遺族を死亡保険金受取人とする定期保険の保険料は、その役員への給与となる。"],"tf":[true,true,false,true],"exp":["","","法人が受け取ると益金。",""],"ans":[3],"point":"法人が受け取る保険金・給付金は益金。","weak":false,"date":"新作"},{"id":"R2-29","lv":"2","field":"リスク管理","topic":"保険の用語","kind":"適切","opts":["保険契約者は、保険会社と契約を結び、契約上の権利と義務を持つ人である。","保険事故とは、保険料の支払いが遅れることである。","被保険者は、保険金を受け取る人のことである。","責任開始日は、保険証券が発行された日である。"],"tf":[true,false,false,false],"exp":["","保険金支払いの対象となる出来事（死亡など）。","保険の対象となる人。受け取る人は受取人。","申込み・告知（診査）・第1回保険料の払込みの3つがそろった日。"],"ans":[1],"point":"責任開始日＝申込み・告知・第1回保険料の3つがそろった日。","weak":false,"date":"新作"},{"id":"R2-30","lv":"2","field":"リスク管理","topic":"リスクマネジメント","kind":"不適切","opts":["リスクファイナンシングには、保有と移転がある。","リスクコントロールには、回避・損失防止・損失削減などがある。","発生頻度が高く損害も大きいリスクは、保険で移転するのが最も適している。","保険に加入することは、リスクの移転にあたる。"],"tf":[true,true,false,true],"exp":["","","そのような活動は「回避」が基本。保険は頻度が低く損害が大きいリスク向け。",""],"ans":[3],"point":"頻度低・損害大→保険で移転。頻度高・損害大→回避。","weak":false,"date":"新作"},{"id":"R1-01","lv":"1","field":"リスク管理","topic":"法人の定期保険（最高解約返戻率）","kind":"適切","opts":["最高解約返戻率が50％超70％以下の場合、保険期間の前半4割の期間は保険料の40％を資産計上する。","最高解約返戻率が70％超85％以下の場合、前半4割の期間は保険料の90％を資産計上する。","最高解約返戻率が85％超の場合、資産計上割合は一律60％である。","最高解約返戻率が50％以下の場合、保険料は全額資産計上する。"],"tf":[true,false,false,false],"exp":["","60％を資産計上。","当初10年は最高解約返戻率×90％、11年目以降は×70％など。","全額損金。"],"ans":[1],"point":"50％以下：全額損金／50〜70％：40％資産／70〜85％：60％資産／85％超：返戻率×90％（10年）。","weak":false,"date":"新作"},{"id":"R1-02","lv":"1","field":"リスク管理","topic":"保険法","kind":"不適切","opts":["保険金の請求権は、5年間行使しないと時効で消滅する。","契約者以外を被保険者とする死亡保険契約は、被保険者の同意がなければ無効である。","保険法は、共済契約にも適用される。","保険金受取人の変更は、遺言によってもできる。"],"tf":[false,true,true,true],"exp":["3年。","","",""],"ans":[1],"point":"保険金請求権の時効は3年。","weak":false,"date":"新作"},{"id":"R1-03","lv":"1","field":"リスク管理","topic":"自動車保険のノンフリート等級","kind":"適切","opts":["車両保険で台風による損害の保険金を受け取ると、翌年は1等級ダウン事故として扱われる。","ノンフリート等級は1等級から15等級まである。","対人賠償保険で保険金を受け取っても、等級には影響しない。","3等級ダウン事故の事故有係数適用期間は1年である。"],"tf":[true,false,false,false],"exp":["","1〜20等級。","3等級ダウン。","3年加算される。"],"ans":[1],"point":"3等級ダウン＝対人・対物・車両（衝突）など。1等級ダウン＝火災・台風・盗難など。","weak":false,"date":"新作"},{"id":"R1-04","lv":"1","field":"リスク管理","topic":"企業向けの損害保険","kind":"不適切","opts":["企業費用・利益総合保険は、火災などで営業を休止した際の利益の損失を補償する。","労働災害総合保険は、政府労災保険の上乗せ補償に使われる。","受託者賠償責任保険は、自社が製造した製品の欠陥による損害を補償する。","動産総合保険は、商品や設備などの偶然な事故による損害を補償する。"],"tf":[true,true,false,true],"exp":["","","それはPL保険。受託者賠償は預かった物の損害。",""],"ans":[3],"point":"PL保険＝製品の欠陥、受託者賠償＝預かり物。","weak":false,"date":"新作"},{"id":"R1-05","lv":"1","field":"リスク管理","topic":"生命保険契約に関する権利","kind":"適切","opts":["死亡保険金の非課税枠の計算では、相続を放棄した人は法定相続人の数に含めない。","生命保険契約に関する権利は、払い込んだ保険料の合計額で評価する。","保険料負担者が死亡し、まだ保険事故が起きていない生命保険契約の権利は、解約返戻金相当額で相続税の対象となる。","死亡保険金の非課税枠は、相続人以外の人が受け取った保険金にも適用される。"],"tf":[false,false,true,false],"exp":["放棄者も数に含める。","解約返戻金相当額で評価する。","","相続人が受け取ったものだけ。"],"ans":[3],"point":"生命保険契約に関する権利＝解約返戻金相当額。","weak":false,"date":"新作"},{"id":"R1-06","lv":"1","field":"リスク管理","topic":"金融類似商品","kind":"不適切","opts":["保険期間5年以下の一時払養老保険の満期差益は、20.315％の源泉分離課税となる。","保険期間5年超の一時払養老保険を5年以内に解約した場合の差益も、源泉分離課税となる。","一時払終身保険を5年以内に解約しても、金融類似商品には該当しない。","金融類似商品の源泉分離課税の税率は、所得税・住民税合わせて10.21％である。"],"tf":[true,true,true,false],"exp":["","","満期がないため。一時所得になる。","20.315％。"],"ans":[4],"point":"一時払・5年以内・保障倍率が低い→金融類似商品（20.315％源泉分離）。","weak":false,"date":"新作"},{"id":"R1-07","lv":"1","field":"リスク管理","topic":"保険会社の健全性","kind":"適切","opts":["基礎利益は保険会社の本業の儲けを示し、有価証券の売却損益（キャピタル損益）を含む。","ソルベンシー・マージン比率200％以上が、健全性の一つの目安とされる。","保険会社の格付けは、保険会社自身が付ける。","実質純資産額がマイナスでも、業務停止命令の対象とはならない。"],"tf":[false,true,false,false],"exp":["キャピタル損益は含まない。","","格付会社が付ける。","業務停止命令の対象となりうる。"],"ans":[2],"point":"ソルベンシー・マージン比率200％が目安。","weak":false,"date":"新作"},{"id":"R1-08","lv":"1","field":"リスク管理","topic":"保険給付と医療費控除","kind":"不適切","opts":["介護保障保険の給付金（本人受取）は非課税である。","入院給付金を受け取った場合でも、医療費控除の計算で医療費から差し引く必要はない。","先進医療の技術料は公的医療保険の対象外で、全額自己負担となる。","就業不能保険の給付金（本人受取）は非課税である。"],"tf":[true,false,true,true],"exp":["","補てん金としてその入院の医療費から差し引く。","",""],"ans":[2],"point":"医療費控除は「医療費−保険金などの補てん」。","weak":false,"date":"新作"},{"id":"R1-09","lv":"1","field":"リスク管理","topic":"ハーフタックスプラン","kind":"適切","opts":["原則全従業員加入で、死亡保険金受取人が遺族、満期保険金受取人が法人の養老保険は、保険料の1/2を資産計上し、1/2を福利厚生費とする。","死亡保険金・満期保険金とも受取人が法人の養老保険は、1/2を損金に算入できる。","役員だけを被保険者としても、保険料の1/2を損金に算入できる。","死亡保険金・満期保険金とも受取人が被保険者側の養老保険は、全額福利厚生費となる。"],"tf":[true,false,false,false],"exp":["","全額資産計上。","役員等特定の人だけなら給与扱い。","給与となる。"],"ans":[1],"point":"ハーフタックス＝全員加入・死亡は遺族・満期は法人。","weak":false,"date":"新作"},{"id":"R1-10","lv":"1","field":"リスク管理","topic":"地震保険の詳細","kind":"適切","opts":["地震保険料には建築年割引・耐震等級割引などがあるが、重複して適用することはできない。","地震保険の保険期間は、最長10年である。","地震発生の翌日から10日を経過した後に生じた損害も補償される。","一部損の場合、保険金額の10％が支払われる。"],"tf":[true,false,false,false],"exp":["","最長5年。","補償されない。","全損100％・大半損60％・小半損30％・一部損5％。"],"ans":[1],"point":"全損100％・大半損60％・小半損30％・一部損5％。","weak":false,"date":"新作"},{"id":"K2-01","lv":"2","field":"金融資産運用","topic":"経済指標","kind":"不適切","opts":["景気動向指数は内閣府が公表し、CIは景気変動の大きさやテンポ（量感）を表す。","消費者物価指数は、総務省が公表している。","日銀短観は、内閣府が四半期ごとに公表している。","GDP統計は、内閣府が公表している。"],"tf":[true,true,false,true],"exp":["","","日本銀行が公表する。",""],"ans":[3],"point":"GDP・景気動向指数＝内閣府、CPI＝総務省、短観・マネーストック＝日銀、企業物価指数＝日銀。","weak":false,"date":"新作"},{"id":"K2-02","lv":"2","field":"金融資産運用","topic":"金融政策","kind":"適切","opts":["預金準備率を引き上げると、市中の資金量が増える。","日本銀行が国債などを買う買いオペレーションは、市場の資金量を増やす。","物価が上がりすぎているときは、金融緩和を行う。","売りオペレーションは、市場金利を下げる効果がある。"],"tf":[false,true,fals いて求める方法である。","DCF法は、一期間の純収益を還元利回りで割る方法である。"],"tf":[true,false,false,false],"exp":["","それは収益還元法。取引事例比較法は似た取引の価格から求める。","それはDCF法。直接還元法は一期間の純収益÷還元利回り。","それは直接還元法。"],"ans":[1],"point":"原価法＝コスト、取引事例比較法＝相場、収益還元法＝収益（直接還元・DCF）。","weak":false,"date":"新作"},{"id":"F2-04","lv":"2","field":"不動産","topic":"宅地建物取引業法","kind":"適切","opts":["一般媒介契約の有効期間は、3か月以内である。","専任媒介契約では、依頼者が自分で見つけた相手と直接契約することはできない。","宅建業者が売主で宅建業者でない人が買主の場合、手付金は代金の2割までである。","宅建業者の報酬の上限は、売買価格の5％である。"],"tf":[false,false,true,false],"exp":["一般媒介には期間の規制がない。専任・専属専任が3か月以内。","できないのは専属専任媒介だけ。専任媒介はOK。","","400万円超は「3％＋6万円」（＋消費税）。"],"ans":[3],"point":"専属専任だけ自己発見取引×。手付は2割まで。","weak":true,"date":"新作"},{"id":"F2-05","lv":"2","field":"不動産","topic":"売買契約","kind":"不適切","opts":["手付による解除は、相手方が契約の履行に着手するまでできる。","契約不適合の場合、買主は不適合を知った時から1年以内に売主に通知する必要がある。","引渡し前に双方の責任でない理由で建物が滅失した場合、買主は代金の支払いを拒める。","公簿売買の契約では、登記面積と実測面積が違えば必ず代金を精算する。"],"tf":[true,true,true,false],"exp":["","","","公簿売買は原則として精算しない。"],"ans":[4],"point":"手付解除は相手方の履行着手まで。","weak":false,"date":"新作"},{"id":"F2-06","lv":"2","field":"不動産","topic":"借地権","kind":"適切","opts":["建物譲渡特約付借地権の存続期間は、20年以上である。","普通借地権の存続期間は、30年以上である。","事業用定期借地権は、居住用の建物にも使える。","一般定期借地権の存続期間は、30年以上である。"],"tf":[false,true,false,false],"exp":["30年以上。","","事業用の建物だけ（居住用は不可）。","50年以上。"],"ans":[2],"point":"普通30年以上、一般定期50年以上、事業用10〜50年未満、建物譲渡特約付30年以上。","weak":false,"date":"新作"},{"id":"F2-07","lv":"2","field":"不動産","topic":"借家権","kind":"不適切","opts":["期間1年以上の定期借家契約では、満了の1年前から6か月前までに終了の通知が必要である。","普通借家契約で1年未満の期間を定めると、期間の定めのない契約とみなされる。","定期借家契約は、書面（電磁的記録を含む）で締結しなければならない。","定期借家契約は、公正証書で締結しなければならない。"],"tf":[true,true,true,false],"exp":["","","","書面でよい。公正証書が必要なのは事業用定期借地権。"],"ans":[4],"point":"定期借家＝書面でOK、公正証書は不要。","weak":true,"date":"新作"},{"id":"F2-08","lv":"2","field":"不動産","topic":"都市計画法","kind":"適切","opts":["準都市計画区域は、都市計画区域の中に指定される。","市街化区域の開発許可は、例外なく1,000㎡以上が対象である。","市街化区域は、既に市街地になっている区域と、おおむね10年以内に優先的に市街化を図る区域である。","市街化調整区域には、必ず用途地域を定める。"],"tf":[false,false,true,false],"exp":["都市計画区域の外に指定される。","三大都市圏の一定区域は500㎡以上など例外がある。","","原則として用途地域を定めない。"],"ans":[3],"point":"市街化区域＝用途地域を定める、調整区域＝原則定めない。","weak":false,"date":"新作"},{"id":"F2-09","lv":"2","field":"不動産","topic":"開発許可","kind":"不適切","opts":["市街化調整区域では、規模にかかわらず原則として許可が必要である。","市街化区域では、原則1,000㎡以上の開発行為に許可が必要である。","市街化調整区域で農家の住宅を建てるための開発行為にも、許可が必要である。","開発許可を出すのは、原則として都道府県知事である。"],"tf":[true,true,false,true],"exp":["","","農林漁業用の建物や農家住宅は許可不要。",""],"ans":[3],"point":"調整区域でも農林漁業用の建物は許可不要。","weak":false,"date":"新作"},{"id":"F2-10","lv":"2","field":"不動産","topic":"建ぺい率","kind":"適切","opts":["防火地域内の耐火建築物等は、建ぺい率が5％緩和される。","建ぺい率の異なる地域にまたがる敷地では、面積による加重平均で建ぺい率を求める。","建ぺい率の異なる地域にまたがる敷地では、過半の地域の建ぺい率が適用される。","準防火地域の耐火建築物には、建ぺい率の制限がない。"],"tf":[false,true,false,false],"exp":["10％緩和（指定80％の地域なら制限なし）。","","過半で決まるのは用途制限。建ぺい率は加重平均。","10％緩和。"],"ans":[2],"point":"建ぺい率・容積率は加重平均、用途は過半。","weak":true,"date":"新作"},{"id":"F2-11","lv":"2","field":"不動産","topic":"容積率","kind":"不適切","opts":["前面道路が2つ以上ある場合は、幅員の狭いほうで容積率を計算する。","前面道路の幅員が12m未満の場合、「幅員×法定乗数」と指定容積率のいずれか低いほうが適用される。","容積率の異なる地域にまたがる敷地では、面積による加重平均で求める。","住宅の地下室の床面積は、住宅部分の床面積の3分の1まで容積率に算入しない。"],"tf":[false,true,true,true],"exp":["広いほうの幅員を使う。","住居系は4/10、それ以外は6/10。","",""],"ans":[1],"point":"前面道路12m未満→幅員×4/10（住居系）。2つ以上なら広いほう。","weak":true,"date":"新作"},{"id":"F2-12","lv":"2","field":"不動産","topic":"道路と接道義務","kind":"適切","opts":["セットバック部分は、建ぺい率や容積率の計算で敷地面積に含める。","2項道路では、原則として道路の中心線から3m後退した線が道路の境界線とみなされる。","自動車専用道路だけに接している敷地でも、接道義務を満たす。","建築物の敷地は、原則として幅員4m以上の道路に2m以上接していなければならない。"],"tf":[false,false,false,true],"exp":["含めない。","2m後退。","満たさない。",""],"ans":[4],"point":"接道＝4m以上の道路に2m以上。2項道路は中心線から2m後退。","weak":true,"date":"新作"},{"id":"F2-13","lv":"2","field":"不動産","topic":"用途制限","kind":"不適切","opts":["第一種低層住居専用地域には、小学校や中学校を建てられる。","第一種低層住居専用地域には、病院を建てられる。","工業専用地域には、住宅を建てられない。","敷地が2つ以上の用途地域にまたがる場合、過半の地域の用途制限が適用される。"],"tf":[true,false,true,true],"exp":["","病院は不可。診療所は可。","",""],"ans":[2],"point":"住宅が建てられないのは工業専用地域だけ。","weak":false,"date":"新作"},{"id":"F2-14","lv":"2","field":"不動産","topic":"高さの制限","kind":"適切","opts":["隣地斜線制限は、第一種低層住居専用地域にも適用される。","第一種・第二種低層住居専用地域と田園住居地域には、10mまたは12mの絶対高さ制限がある。","北側斜線制限は、すべての用途地域に適用される。","日影規制は、商業地域にも適用される。"],"tf":[false,true,false,false],"exp":["絶対高さ制限があるので適用されない。","","低層住居専用・中高層住居専用・田園住居地域だけ。","商業・工業・工業専用地域は対象外。"],"ans":[2],"point":"絶対高さ＝低層・田園。北側斜線＝住居専用系＋田園。","weak":false,"date":"新作"},{"id":"F2-15","lv":"2","field":"不動産","topic":"農地法","kind":"適切","opts":["市街化区域内の農地を転用する場合も、都道府県知事の許可が必要である。","自分の農地を転用するときは、5条許可が必要である。","農地を農地のまま売買するには、農業委員会の許可（3条許可）が必要である。","相続で農地を取得した場合、許可も届出も不要である。"],"tf":[false,false,true,false],"exp":["あらかじめ農業委員会に届け出れば許可不要。","4条。5条は転用目的の売買など。","","許可は不要だが、農業委員会への届出が必要。"],"ans":[3],"point":"3条＝権利移動、4条＝転用、5条＝転用目的の権利移動。","weak":false,"date":"新作"},{"id":"F2-16","lv":"2","field":"不動産","topic":"不動産取得税","kind":"不適切","opts":["宅地の課税標準は、特例で固定資産税評価額の2分の1とされている。","贈与による不動産の取得にも、不動産取得税はかからない。","一定の新築住宅（床面積50㎡以上240㎡以下）は、課税標準から1,200万円が控除される。","相続による不動産の取得には、不動産取得税はかからない。"],"tf":[true,false,true,true],"exp":["","贈与ではかかる（相続・法人の合併などは非課税）。","",""],"ans":[2],"point":"相続は非課税、贈与は課税。","weak":false,"date":"新作"},{"id":"F2-17","lv":"2","field":"不動産","topic":"登録免許税と印紙税","kind":"適切","opts":["印紙税の課税文書に印紙を貼らなかった場合、過怠税が課される。","登録免許税の課税標準は、実際の売買価額である。","電子契約で作成した契約書にも、印紙税がかかる。","相続による所有権移転登記には、登録免許税はかからない。"],"tf":[true,false,false,false],"exp":["","固定資産税評価額。","電子契約には印紙税はかからない。","税率0.4％でかかる。"],"ans":[1],"point":"登録免許税の課税標準＝固定資産税評価額。電子契約は印紙税なし。","weak":false,"date":"新作"},{"id":"F2-18","lv":"2","field":"不動産","topic":"固定資産税","kind":"不適切","opts":["固定資産税は、毎年1月1日の所有者に課される。","小規模住宅用地（200㎡以下の部分）は、課税標準が6分の1になる。","固定資産税の標準税率は1.7％である。","一定の新築住宅は、一定期間、税額が2分の1に減額される。"],"tf":[true,true,false,true],"exp":["","","1.4％。",""],"ans":[3],"point":"固定資産税＝1/1の所有者・標準1.4％・小規模住宅用地1/6。","weak":false,"date":"新作"},{"id":"F2-19","lv":"2","field":"不動産","topic":"都市計画税","kind":"適切","opts":["都市計画税は、市街化調整区域にも原則として課される。","都市計画税は原則として市街化区域内の土地・家屋に課され、制限税率は0.3％である。","都市計画税の小規模住宅用地の特例では、課税標準が6分の1になる。","都市計画税は国税である。"],"tf":[false,true,false,false],"exp":["原則として市街化区域内。","","3分の1。","市町村税。"],"ans":[2],"point":"都市計画税＝0.3％上限・小規模住宅用地1/3。","weak":false,"date":"新作"},{"id":"F2-20","lv":"2","field":"不動産","topic":"不動産の譲渡所得","kind":"不適切","opts":["長期譲渡所得の税率は、所得税・住民税合わせて20.315％である。","取得費が分からない場合は、譲渡収入の10％を概算取得費とすることができる。","土地・建物の長期・短期は、譲渡した年の1月1日時点で所有期間が5年を超えるかで判定する。","短期譲渡所得の税率は、所得税・住民税合わせて39.63％である。"],"tf":[true,false,true,true],"exp":["","5％。","",""],"ans":[2],"point":"長期20.315％、短期39.63％、概算取得費5％。","weak":false,"date":"新作"},{"id":"F2-21","lv":"2","field":"不動産","topic":"居住用財産の3,000万円特別控除","kind":"適切","opts":["所有期間が10年を超えていることが要件である。","3,000万円特別控除と住宅ローン控除は、同時に受けられる。","住まなくなった日から3年目の年の12月31日までに譲渡すれば、適用を受けられる。","譲渡損失が出た場合でも、3,000万円特別控除を受けられる。"],"tf":[false,false,true,false],"exp":["所有期間の要件はない（10年超は軽減税率の要件）。","入居年とその前後2年（計5年）は併用できない。","","譲渡益がなければ意味がない（損失は別の特例）。"],"ans":[3],"point":"3,000万控除＝所有期間不問・住まなくなって3年目の年末まで。","weak":false,"date":"新作"},{"id":"F2-22","lv":"2","field":"不動産","topic":"交換と買換え","kind":"不適切","opts":["特定居住用財産の買換え特例は、譲渡資産の所有期間10年超・居住期間10年以上が要件である。","交換差金が、高いほうの資産の価額の20％以下であることが要件である。","固定資産の交換の特例は、同じ種類の資産で、1年以上所有していたものが対象である。","買換え特例を受けると、譲渡益への課税は完全に免除される。"],"tf":[true,true,true,false],"exp":["","","","課税の繰延べ。将来売るときに課税される。"],"ans":[4],"point":"買換え特例は「免除」ではなく「繰延べ」。","weak":false,"date":"新作"},{"id":"F2-23","lv":"2","field":"不動産","topic":"不動産投資の利回り","kind":"適切","opts":["同じ物件の表面利回りは6％である。","価格5,000万円、年間賃料400万円、年間諸経費100万円の物件の実質（NOI）利回りは6％である。","同じ物件のNOI利回りは8％である。","NOI利回りは、年間賃料に諸経費を加えて計算する。"],"tf":[false,true,false,false],"exp":["400÷5,000＝8％。","(400−100)÷5,000＝6％。","諸経費を引いて6％。","差し引いて計算する。"],"ans":[2],"point":"表面＝賃料÷価格、NOI＝（賃料−経費）÷価格。","weak":false,"date":"新作"},{"id":"F2-24","lv":"2","field":"不動産","topic":"土地の有効活用","kind":"不適切","opts":["事業受託方式では、事業全般をデベロッパーに任せ、建設資金は土地所有者が用意する。","定期借地権方式では、土地を貸すだけなので建設資金は不要である。","等価交換方式では、土地所有者が土地を出し、デベロッパーが建物を建て、出資割合に応じて土地・建物を分け合う。","建設協力金方式では、建物の所有権はテナントにある。"],"tf":[true,true,true,false],"exp":["","","","建物は土地所有者のもの（テナントの協力金で建てる）。"],"ans":[4],"point":"建設協力金方式＝建物は地主のもの。","weak":false,"date":"新作"},{"id":"F2-25","lv":"2","field":"不動産","topic":"投資判断の手法","kind":"適切","opts":["借入金利が物件の利回りより高いとき、レバレッジ効果はプラスに働く。","IRR法では、内部収益率が期待利回りを下回れば投資する価値がある。","DSCR（借入金償還余裕率）が1未満なら、返済に余裕がある。","NPV法では、正味現在価値が0より大きければ投資する価値があると判断する。"],"tf":[false,false,false,true],"exp":["マイナス（逆レバレッジ）。","上回れば価値がある。","1未満は収入で返済をまかなえない状態。",""],"ans":[4],"point":"NPV＞0、IRR＞期待利回り→投資OK。","weak":false,"date":"新作"},{"id":"F2-26","lv":"2","field":"不動産","topic":"借地借家法の細かいルール","kind":"適切","opts":["普通借家契約で貸主が更新を拒絶するには、正当事由が必要である。","造作買取請求権は、特約で排除することはできない。","借地権を第三者に対抗するには、借地権そのものの登記が必要である。","定期借家契約では、中途解約は一切できない。"],"tf":[true,false,false,false],"exp":["","特約で排除できる。","借地上の建物を本人名義で登記していれば対抗できる。","床面積200㎡未満の居住用で、やむを得ない事情があれば借主から解約できる。"],"ans":[1],"point":"借地権の対抗要件＝借地上の建物の登記でもOK。","weak":false,"date":"新作"},{"id":"F2-27","lv":"2","field":"不動産","topic":"重要事項説明","kind":"不適切","opts":["重要事項の説明は、契約が成立するまでに宅地建物取引士が書面（電磁的方法を含む）で行う。","説明の際は、宅地建物取引士証を提示しなければならない。","テレビ会議などを使ったIT重説も認められている。","重要事項の説明は、契約成立後に行ってもよい。"],"tf":[true,true,true,false],"exp":["","","","契約成立前に行う。"],"ans":[4],"point":"重説は契約前・宅建士が・取引士証を示して。","weak":false,"date":"新作"},{"id":"F2-28","lv":"2","field":"不動産","topic":"不動産と消費税","kind":"適切","opts":["個人が自宅を売却した場合にも、消費税がかかる。","住宅の家賃（貸付期間1か月以上）には、消費税がかかる。","不動産の仲介手数料は、消費税の非課税取引である。","建物の売買は消費税の課税対象で、土地の売買は非課税である。"],"tf":[false,false,false,true],"exp":["事業ではないのでかからない。","非課税。","課税取引。",""],"ans":[4],"point":"土地と住宅家賃は非課税、建物・仲介手数料は課税。","weak":false,"date":"新作"},{"id":"F2-29","lv":"2","field":"不動産","topic":"防火地域・準防火地域","kind":"不適切","opts":["建築物が防火地域と準防火地域にまたがる場合、原則として厳しいほうの規制が適用される。","防火地域内の建築物は、建ぺい率の制限が厳しくなる。","準防火地域の耐火・準耐火建築物等は、建ぺい率が10％緩和される。","防火地域内で階数3以上または延べ面積100㎡超の建築物は、原則として耐火建築物等にしなければならない。"],"tf":[true,false,true,true],"exp":["","耐火建築物等なら10％緩和される。","",""],"ans":[2],"point":"防火地域の耐火建築物等＝建ぺい率＋10％。","weak":false,"date":"新作"},{"id":"F2-30","lv":"2","field":"不動産","topic":"仮登記と登記記録","kind":"適切","opts":["仮登記には、第三者に対抗する力がある。","仮登記には、後に本登記をしたときの順位を保全する効力がある。","すべての土地に、精度の高い地図（14条地図）が備え付けられている。","登記事項証明書は、所有者本人しか取得できない。"],"tf":[false,true,false,false],"exp":["対抗力はない（本登記で対抗力）。","","備え付けられていない地域も多い（公図で代用）。","誰でも手数料を払えば取得できる。"],"ans":[2],"point":"仮登記＝順位保全のみ、対抗力なし。","weak":false,"date":"新作"},{"id":"F1-01","lv":"1","field":"不動産","topic":"定期借地権の設定","kind":"適切","opts":["一般定期借地権の設定は、口頭でもよい。","事業用定期借地権の設定契約は、公正証書でしなければならない。","建物譲渡特約付借地権の設定は、公正証書でしなければならない。","事業用定期借地権の存続期間は、10年以上60年未満である。"],"tf":[false,true,false,false],"exp":["書面（電磁的記録を含む）が必要。","","方式の定めはない。","10年以上50年未満。"],"ans":[2],"point":"公正証書が必要なのは事業用定期借地権だけ。","weak":false,"date":"新作"},{"id":"F1-02","lv":"1","field":"不動産","topic":"投資分析","kind":"不適切","opts":["NPVが0より大きければ、投資する価値があると判断できる。","IRRは、NPVが0となる割引率である。","借入比率を高めれば、常に自己資金に対する利回りは上がる。","DCF法は、将来のキャッシュフローを現在価値に割り引いて評価する方法である。"],"tf":[true,true,false,true],"exp":["","","借入金利が物件利回りより高いと逆に下がる。",""],"ans":[3],"point":"レバレッジは借入金利＜物件利回りのときだけプラス。","weak":false,"date":"新作"},{"id":"F1-03","lv":"1","field":"不動産","topic":"交換・買換えの特例","kind":"適切","opts":["固定資産の交換の特例では、交換で取得した資産を交換前と同じ用途に使わなくてもよい。","事業用資産の買換え特例では、買い換える土地の面積に制限はない。","特定居住用財産の買換え特例は、譲渡価額が1億円を超えても受けられる。","既成市街地等内で中高層耐火建築物に建て替える立体買換えの特例では、譲渡益の課税を繰り延べられる。"],"tf":[false,false,false,true],"exp":["同じ用途に使う必要がある。","原則として譲渡した土地の5倍まで。","1億円以下が要件。",""],"ans":[4],"point":"交換特例＝同種・同用途・1年以上所有・差金20％以下。","weak":false,"date":"新作"},{"id":"F1-04","lv":"1","field":"不動産","topic":"貸家建付地・貸宅地の評価","kind":"不適切","opts":["使用貸借で貸している土地は、自用地として評価する。","借家権割合は、全国一律50％である。","貸家建付地は、自用地評価額×（1−借地権割合×借家権割合×賃貸割合）で評価する。","貸宅地（底地）は、自用地評価額×（1−借地権割合）で評価する。"],"tf":[true,false,true,true],"exp":["","全国一律30％。","",""],"ans":[2],"point":"借家権割合は30％。使用貸借は自用地。","weak":false,"date":"新作"},{"id":"F1-05","lv":"1","field":"不動産","topic":"容積率の特例","kind":"適切","opts":["幅員15m以上の特定道路から70m以内にある、幅員6m以上12m未満の道路に面する敷地は、容積率が緩和される。","エレベーターの昇降路の部分は、容積率の床面積に算入される。","前面道路の幅員が12m以上の場合も、幅員×法定乗数で容積率の上限を求める。","角地の建ぺい率の緩和は、20％である。"],"tf":[true,false,false,false],"exp":["","算入しない（共同住宅の共用廊下・階段も不算入）。","12m以上なら指定容積率だけ。","10％。"],"ans":[1],"point":"特定道路＝15m以上、70m以内、6〜12m未満の前面道路。","weak":false,"date":"新作"},{"id":"F1-06","lv":"1","field":"不動産","topic":"賃貸不動産の法人化","kind":"不適切","opts":["管理会社方式では、管理料は家賃の5〜10％程度が目安とされ、過大だと否認されるおそれがある。","サブリース方式では、管理会社が建物を一括で借り上げ、入居者に転貸する。","所有方式では、建物を法人に移して法人が家賃を受け取る。","所有方式で建物を法人に移しても、土地について借地権の課税関係を考える必要はまったくない。"],"tf":[true,true,true,false],"exp":["","","","権利金の認定課税を避けるため、無償返還届出などの対応が必要。"],"ans":[4],"point":"所有方式は「土地の無償返還に関する届出書」がポイント。","weak":false,"date":"新作"},{"id":"F1-07","lv":"1","field":"不動産","topic":"不動産取得時の税","kind":"適切","opts":["固定資産税の新築住宅の減額は、床面積の制限がない。","住宅用家屋の所有権保存登記の登録免許税は、特例で0.15％に軽減される。","売買による土地の所有権移転登記の登録免許税は、本則0.2％である。","住宅の不動産取得税の標準税率は、常に4％である。"],"tf":[false,true,false,false],"exp":["床面積50〜280㎡が要件で、120㎡までの部分が減額。","","本則2％（特例1.5％）。","特例で3％（土地も3％）。"],"ans":[2],"point":"保存登記0.15％、移転登記（住宅）0.3％、土地の売買1.5％（特例）。","weak":false,"date":"新作"},{"id":"F1-08","lv":"1","field":"不動産","topic":"居住用の区分所有マンションの評価","kind":"不適切","opts":["評価水準が0.6未満の場合は、評価額を0.6になるよう補正する。","事業用のテナント物件にも、この補正は適用される。","2024年1月1日以後の相続・贈与から、居住用の区分所有財産は評価乖離率に応じて評価額が補正される。","評価水準が1を超える場合は、評価額を1になるよう補正する。"],"tf":[true,false,true,true],"exp":["","居住用の区分所有財産が対象。事業用は対象外。","",""],"ans":[2],"point":"評価水準0.6未満→0.6に引き上げ、1超→1に引き下げ。","weak":false,"date":"新作"},{"id":"F1-09","lv":"1","field":"不動産","topic":"生産緑地","kind":"適切","opts":["指定から30年が経過する前に特定生産緑地に指定されると、買取申出ができる時期が10年延長される。","生産緑地の面積要件は500㎡以上で、例外はない。","生産緑地は、宅地並み課税となる。","生産緑地の買取申出は、指定から10年経過すればできる。"],"tf":[true,false,false,false],"exp":["","原則500㎡以上だが、条例で300㎡以上に引き下げられる。","農地課税。","30年経過（または主たる従事者の死亡など）。"],"ans":[1],"point":"生産緑地＝30年・特定生産緑地で10年延長・農地課税。","weak":false,"date":"新作"},{"id":"F1-10","lv":"1","field":"不動産","topic":"収益不動産の指標","kind":"適切","opts":["還元利回り（キャップレート）が上昇すると、直接還元法による収益価格は下落する。","表面利回りは、諸経費を差し引いて計算する。","LTV（借入比率）が高いほど、安全性は高い。","DSCRは、借入金の返済額÷純収益で求める。"],"tf":[true,false,false,false],"exp":["","差し引かない。","低いほど安全。","純収益÷借入金返済額。"],"ans":[1],"point":"収益価格＝純収益÷還元利回り。利回り↑→価格↓。","weak":false,"date":"新作"},{"id":"S2-01","lv":"2","field":"相続・事業承継","topic":"法定相続分","kind":"適切","opts":["相続人が配偶者と直系尊属の場合、配偶者の法定相続分は2分の1である。","相続人が配偶者と子の場合、法定相続分は配偶者2分の1、子（全員で）2分の1である。","父母の一方だけが同じ兄弟姉妹（半血）の相続分は、父母とも同じ兄弟姉妹と同じである。","相続人が配偶者と兄弟姉妹の場合、配偶者の法定相続分は3分の2である。"],"tf":[false,true,false,false],"exp":["3分の2。","","2分の1。","4分の3。"],"ans":[2],"point":"配偶者は子と1/2、親と2/3、兄弟姉妹と3/4。","weak":false,"date":"新作"},{"id":"S2-02","lv":"2","field":"相続・事業承継","topic":"代襲相続","kind":"不適切","opts":["相続を放棄した子の子は、代襲相続人となる。","子が相続開始前に死亡していた場合、その子（被相続人の孫）が代襲相続人となる。","兄弟姉妹の代襲相続は、甥・姪までである。","相続欠格や相続人の廃除も、代襲相続の原因となる。"],"tf":[false,true,true,true],"exp":["放棄は代襲原因にならない。","","",""],"ans":[1],"point":"代襲原因＝死亡・欠格・廃除。放棄は×。","weak":false,"date":"新作"},{"id":"S2-03","lv":"2","field":"相続・事業承継","topic":"相続の承認と放棄","kind":"適切","opts":["限定承認は、相続人のうち1人でも単独で行える。","相続の放棄は、相続の開始を知った時から3か月以内に家庭裁判所に申述する。","相続の放棄は、他の相続人と共同で行わなければならない。","相続の放棄は、相続開始前にもできる。"],"tf":[false,true,false,false],"exp":["相続人全員が共同で行う。","","単独でできる。","できない（遺留分の放棄は家裁の許可で可）。"],"ans":[2],"point":"放棄＝単独・3か月以内・家裁。限定承認＝全員で。","weak":false,"date":"新作"},{"id":"S2-04","lv":"2","field":"相続・事業承継","topic":"遺言","kind":"不適切","opts":["自筆証書遺言に添付する財産目録は、パソコンで作成してもよい（各ページに署名押印が必要）。","公正証書遺言も、家庭裁判所の検認が必要である。","公正証書遺言の作成には、証人2人以上の立会いが必要である。","法務局で保管された自筆証書遺言は、家庭裁判所の検認が不要である。"],"tf":[true,false,true,true],"exp":["","公正証書遺言は検認不要。","",""],"ans":[2],"point":"検認不要＝公正証書遺言と法務局保管の自筆証書遺言。","weak":false,"date":"新作"},{"id":"S2-05","lv":"2","field":"相続・事業承継","topic":"遺留分","kind":"適切","opts":["相続人が配偶者と子の場合、遺留分は全体で2分の1である。","遺留分侵害額請求権は、侵害を知った時から3年で時効になる。","相続人が直系尊属だけの場合、遺留分は全体で2分の1である。","兄弟姉妹にも遺留分がある。"],"tf":[true,false,false,false],"exp":["","1年（相続開始から10年）。","3分の1。","兄弟姉妹には遺留分はない。"],"ans":[1],"point":"遺留分＝原則1/2、直系尊属だけ1/3、兄弟姉妹なし。請求は知って1年。","weak":true,"date":"新作"},{"id":"S2-06","lv":"2","field":"相続・事業承継","topic":"遺留分のルール","kind":"不適切","opts":["遺留分を放棄すると、相続人ではなくなる。","遺留分侵害額請求権は、相続開始から10年で消滅する。","相続開始前に遺留分を放棄するには、家庭裁判所の許可が必要である。","遺留分侵害額請求は、金銭の支払いを求めるものである。"],"tf":[false,true,true,true],"exp":["相続人の地位は残る（相続放棄とは別）。","","",""],"ans":[1],"point":"遺留分の放棄≠相続の放棄。","weak":true,"date":"新作"},{"id":"S2-07","lv":"2","field":"相続・事業承継","topic":"遺産分割","kind":"適切","opts":["遺産分割協議は、相続人の過半数の同意で成立する。","配偶者居住権は、配偶者が当然に取得する権利である。","代償分割は、特定の相続人が財産を取得し、他の相続人に代償金を払う方法である。","遺言で遺産分割を禁止することはできない。"],"tf":[false,false,true,false],"exp":["全員の合意が必要。","遺産分割・遺贈・死因贈与などで取得する。","","5年以内の期間を定めて禁止できる。"],"ans":[3],"point":"遺産分割協議は全員一致。","weak":false,"date":"新作"},{"id":"S2-08","lv":"2","field":"相続・事業承継","topic":"相続税の基礎控除","kind":"適切","opts":["法定相続人の数に含める養子は、実子がいても人数の制限はない。","相続税の基礎控除額は、3,000万円＋600万円×法定相続人の数である。","法定相続人の数には、相続を放棄した人は含めない。","特別養子も、普通養子と同じ人数制限を受ける。"],"tf":[false,true,false,false],"exp":["実子がいれば1人、いなければ2人まで。","","含める。","特別養子は実子とみなす。"],"ans":[2],"point":"基礎控除＝3,000万＋600万×法定相続人。放棄者も数える。","weak":false,"date":"新作"},{"id":"S2-09","lv":"2","field":"相続・事業承継","topic":"相続税の非課税財産","kind":"不適切","opts":["相続人が受け取った死亡退職金は、500万円×法定相続人の数まで非課税である。","墓地や仏壇は、相続税の非課税財産である。","相続人が受け取った死亡保険金は、500万円×法定相続人の数まで非課税である。","相続人以外の人が受け取った死亡保険金にも、非課税枠が使える。"],"tf":[true,true,true,false],"exp":["","","","相続人が受け取った分だけ。"],"ans":[4],"point":"死亡保険金・死亡退職金は別々に500万×法定相続人。","weak":false,"date":"新作"},{"id":"S2-10","lv":"2","field":"相続・事業承継","topic":"債務控除","kind":"適切","opts":["生前に購入した墓地の未払金は、債務として控除できる。","香典返しの費用も、葬式費用として控除できる。","団体信用生命保険付きの住宅ローン残高は、債務として控除できる。","通夜や本葬の費用は、葬式費用として控除できる。"],"tf":[false,false,false,true],"exp":["非課税財産に関する債務は控除できない。","控除できない（法要費用も×）。","保険金で返済されるので控除できない。",""],"ans":[4],"point":"香典返し・法要・墓地の未払金は控除×。","weak":false,"date":"新作"},{"id":"S2-11","lv":"2","field":"相続・事業承継","topic":"相続税の加算と軽減","kind":"不適切","opts":["配偶者・1親等の血族（代襲相続人の孫を含む）以外の人は、相続税額が2割加算される。","孫養子（代襲相続人を除く）は、2割加算の対象である。","配偶者の税額軽減は、相続税の申告をしなくても受けられる。","配偶者の税額軽減により、1億6,000万円か法定相続分のいずれか多い額までは相続税がかからない。"],"tf":[true,true,false,true],"exp":["","","申告が必要（税額0でも）。",""],"ans":[3],"point":"配偶者の税額軽減・小規模宅地等の特例は申告が必要。","weak":false,"date":"新作"},{"id":"S2-12","lv":"2","field":"相続・事業承継","topic":"相続税の申告と納付","kind":"不適切","opts":["相続税の申告期限は、相続の開始があったことを知った日の翌日から10か月以内である。","物納財産の第1順位には、国債・地方債・不動産・上場株式などがある。","相続税は、申告期限から3年以内ならいつ納めてもよい。","延納は、金銭で一括納付するのが難しい場合に、担保を提供して認められる。"],"tf":[true,true,false,true],"exp":["","","申告期限までに納付する（延納などを除く）。",""],"ans":[3],"point":"相続税は10か月以内に申告・納付。","weak":false,"date":"新作"},{"id":"S2-13","lv":"2","field":"相続・事業承継","topic":"贈与契約","kind":"適切","opts":["負担付贈与とは、受贈者に一定の負担がない贈与のことである。","書面によらない贈与は、履行が終わった部分を除き、各当事者が解除できる。","死因贈与で取得した財産には、贈与税がかかる。","毎年一定額を贈与する約束（定期贈与）は、毎回別々の贈与として扱われる。"],"tf":[false,true,false,false],"exp":["受贈者に一定の義務を負わせる贈与。","","相続税。","約束した総額を一度に贈与したとみなされることがある（定期金に関する権利）。"],"ans":[2],"point":"死因贈与は相続税。","weak":false,"date":"新作"},{"id":"S2-14","lv":"2","field":"相続・事業承継","topic":"贈与税","kind":"適切","opts":["相続時精算課税は、2024年から年110万円の基礎控除と、累計2,500万円の特別控除が使える。","相続時精算課税の贈与者は、65歳以上の父母・祖父母である。","暦年課税の基礎控除110万円は、贈与者ごとに適用される。","暦年課税で相続財産に加算されるのは、相続開始前3年以内の贈与である。"],"tf":[true,false,false,false],"exp":["","60歳以上（受贈者は18歳以上の子・孫）。","受贈者1人あたり年110万円。","2024年以後の贈与は7年以内に延長。"],"ans":[1],"point":"精算課税＝60歳以上→18歳以上、年110万＋累計2,500万。暦年課税の加算は7年。","weak":true,"date":"新作"},{"id":"S2-15","lv":"2","field":"相続・事業承継","topic":"贈与税の特例","kind":"不適切","opts":["贈与税の配偶者控除は、同じ配偶者から何度でも受けられる。","贈与税の配偶者控除は、婚姻期間20年以上の配偶者から居住用不動産などの贈与を受けた場合に2,000万円まで控除できる。","贈与税の配偶者控除を受けるには、申告が必要である。","贈与税の配偶者控除と基礎控除を合わせると、2,110万円まで贈与税がかからない。"],"tf":[false,true,true,true],"exp":["同じ配偶者からは一生に1回。","","",""],"ans":[1],"point":"おしどり贈与＝婚姻20年以上・2,000万・同じ配偶者から1回。","weak":false,"date":"新作"},{"id":"S2-16","lv":"2","field":"相続・事業承継","topic":"贈与税の計算","kind":"適切","opts":["同じ条件で、贈与税額は75万円である。","同じ条件で、贈与税額は53万円である。","18歳以上の子が父から500万円の贈与を受けた場合（暦年課税・特例税率）、贈与税額は48万5,000円である。","同じ条件で、贈与税額は58万5,000円である。"],"tf":[false,false,true,false],"exp":["基礎控除を引いていない。","それは一般税率で計算した額。","(500−110)＝390万円×15％−10万円＝48.5万円。","控除額10万円を引いていない。"],"ans":[3],"point":"直系尊属→18歳以上の子・孫は特例税率。","weak":false,"date":"新作"},{"id":"S2-17","lv":"2","field":"相続・事業承継","topic":"宅地の評価","kind":"適切","opts":["路線価方式では、路線価×奥行価格補正率×地積で評価する。","2つの道路に面する宅地の正面路線は、路線価の低いほうである。","側方路線影響加算は、正面路線価だけで計算する。","倍率方式では、路線価に倍率を掛けて評価する。"],"tf":[true,false,false,false],"exp":["","奥行価格補正後の価額が高いほう。","側方路線の路線価を使って加算する。","固定資産税評価額×倍率。"],"ans":[1],"point":"倍率方式＝固定資産税評価額×倍率。","weak":false,"date":"新作"},{"id":"S2-18","lv":"2","field":"相続・事業承継","topic":"小規模宅地等の特例","kind":"不適切","opts":["特定居住用宅地等は、330㎡まで評価額が80％減額される。","貸付事業用宅地等は、200㎡まで評価額が50％減額される。","特定事業用宅地等は、400㎡まで評価額が80％減額される。","配偶者が特定居住用宅地等を取得する場合も、申告期限まで住み続けることが要件である。"],"tf":[true,true,true,false],"exp":["","","","配偶者には居住継続・所有継続の要件がない。"],"ans":[4],"point":"居住330㎡80％、事業400㎡80％、貸付200㎡50％。配偶者は無条件。","weak":false,"date":"新作"},{"id":"S2-19","lv":"2","field":"相続・事業承継","topic":"貸家建付地の計算","kind":"適切","opts":["同じ条件で、評価額は9,300万円である。","同じ条件で、評価額は3,000万円である。","同じ条件で、評価額は7,000万円である。","自用地評価額1億円、借地権割合70％、借家権割合30％、賃貸割合100％の貸家建付地の評価額は7,900万円である。"],"tf":[false,false,false,true],"exp":["計算違い。","計算違い。","借地権割合だけを引いている。","1億×(1−0.7×0.3×1)＝7,900万円。"],"ans":[4],"point":"貸家建付地＝自用地×(1−借地権割合×借家権割合×賃貸割合)。","weak":false,"date":"新作"},{"id":"S2-20","lv":"2","field":"相続・事業承継","topic":"上場株式の評価","kind":"適切","opts":["上場株式は、配当還元方式で評価する。","上場株式は、相続開始日の終値、その月・前月・前々月の終値の月平均額のうち、最も低い価額で評価する。","上場株式は、4つの価額のうち最も高い価額で評価する。","上場株式は、前年の平均株価も選べる。"],"tf":[false,true,false,false],"exp":["配当還元方式は取引相場のない株式の同族株主以外向け。","","最も低い価額。","選べない。"],"ans":[2],"point":"上場株式＝4つの価額のうち最低。","weak":false,"date":"新作"},{"id":"S2-21","lv":"2","field":"相続・事業承継","topic":"取引相場のない株式の評価","kind":"不適切","opts":["同族株主以外の株主が取得した株式は、配当還元方式で評価する。","小会社は、類似業種比準方式だけで評価する。","大会社は、原則として類似業種比準方式で評価する。","同族株主等が取得した株式は、原則的評価方式で評価する。"],"tf":[true,false,true,true],"exp":["","原則純資産価額方式（併用方式も選べる）。","純資産価額方式も選べる。",""],"ans":[2],"point":"大会社＝類似業種、小会社＝純資産、中会社＝併用。","weak":false,"date":"新作"},{"id":"S2-22","lv":"2","field":"相続・事業承継","topic":"相続財産の評価","kind":"適切","opts":["貸家は、固定資産税評価額のまま評価する。","保険事故が発生していない生命保険契約に関する権利は、解約返戻金相当額で評価する。","定期預金は、預入額だけで評価する。","自用家屋は、固定資産税評価額×1.1で評価する。"],"tf":[false,true,false,false],"exp":["×(1−借家権割合×賃貸割合)。","","既経過利子（源泉税控除後）も加える。","×1.0。"],"ans":[2],"point":"家屋＝固定資産税評価額×1.0、貸家は借家権分を減額。","weak":false,"date":"新作"},{"id":"S2-23","lv":"2","field":"相続・事業承継","topic":"成年後見制度","kind":"不適切","opts":["成年後見人は、本人が日用品の購入以外でした法律行為を取り消せる。","任意後見契約は、公正証書で結ばなければならない。","任意後見では、家庭裁判所が関わることは一切ない。","法定後見には、後見・保佐・補助の3つの類型がある。"],"tf":[true,true,false,true],"exp":["","","家庭裁判所が任意後見監督人を選任して効力が生じる。",""],"ans":[3],"point":"任意後見＝公正証書、任意後見監督人の選任で開始。","weak":false,"date":"新作"},{"id":"S2-24","lv":"2","field":"相続・事業承継","topic":"自社株の評価対策","kind":"適切","opts":["類似業種比準方式の比準要素は、売上高・利益・純資産である。","従業員持株会に株式を譲渡すると、一律に原則的評価方式で評価される。","高収益の部門を新しく設けると、株価は下がる。","役員退職金を支給すると、利益や純資産が減り、株価が下がることがある。"],"tf":[false,false,false,true],"exp":["配当・利益・純資産。","同族株主以外なので配当還元方式となるのが一般的。","利益が増えるので上がる方向。",""],"ans":[4],"point":"類似業種比準の3要素＝配当・利益・純資産。","weak":false,"date":"新作"},{"id":"S2-25","lv":"2","field":"相続・事業承継","topic":"非上場株式の納税猶予（特例措置）","kind":"不適切","opts":["一般措置では、発行済株式の3分の2までについて、相続税の80％が猶予される。","後継者が会社の代表者であることなどが要件となる。","特例措置では、先代経営者以外の株主からの贈与・相続は対象にならない。","特例措置では、対象株式の全株について、相続税の100％が猶予される。"],"tf":[true,true,false,true],"exp":["","","先代経営者以外の株主からも対象になる（期限あり）。",""],"ans":[3],"point":"特例＝全株・100％、一般＝2/3・80％。","weak":false,"date":"新作"},{"id":"S2-26","lv":"2","field":"相続・事業承継","topic":"相続税の総額の計算","kind":"適切","opts":["相続税の総額は、法定相続人の数とは関係なく決まる。","相続税の総額は、実際に取得した割合で税率を掛けて求める。","相続税の税率は、一律10％である。","相続税の総額は、課税遺産総額を法定相続分で分けたと仮定して税率を掛け、合計して求める。"],"tf":[false,false,false,true],"exp":["基礎控除も法定相続分も人数で変わる。","法定相続分で計算する（実際の取得割合は総額を分けるときに使う）。","10〜55％の超過累進税率。",""],"ans":[4],"point":"総額は法定相続分で計算→実際の取得割合で配分。","weak":false,"date":"新作"},{"id":"S2-27","lv":"2","field":"相続・事業承継","topic":"特別受益と寄与分","kind":"不適切","opts":["婚姻や養子縁組のため、または生計の資本としての贈与は、特別受益となる。","相続人以外の親族も、特別の寄与をした場合に特別寄与料を請求できる。","相続開始から10年を過ぎても、特別受益や寄与分はいつでも主張できる。","寄与分は共同相続人の協議で決め、まとまらなければ家庭裁判所が決める。"],"tf":[true,true,false,true],"exp":["","2019年7月から。","2023年4月から、10年を過ぎると原則として法定相続分で分ける。",""],"ans":[3],"point":"相続開始から10年経過後は原則法定相続分。","weak":false,"date":"新作"},{"id":"S2-28","lv":"2","field":"相続・事業承継","topic":"相続の手続きの期限","kind":"適切","opts":["遺留分侵害額請求には、家庭裁判所の許可が必要である。","相続の放棄は、相続の開始を知った時から6か月以内に行う。","被相続人の所得税の準確定申告は、相続の開始を知った日の翌日から4か月以内に行う。","相続財産が基礎控除以下でも、相続税の申告は必ず必要である。"],"tf":[false,false,true,false],"exp":["不要（意思表示でよい）。","3か月以内。","","特例を使わな いた額。","IRR":"内部収益率。投資のNPVが0になる割引率。","NPV":"正味現在価値。将来のキャッシュフローの現在価値から投資額を引いたもの。","等価交換方式":"地主が土地を、デベロッパーが建設資金を出し、出資割合に応じて土地と建物を分け合う方法。","代襲相続":"相続人になるはずの子や兄弟姉妹が先に亡くなっていた場合などに、その子が代わりに相続すること。","限定承認":"相続した財産の範囲内で借金などを引き継ぐ方法。相続人全員で3か月以内に申し出る。","遺留分":"一定の相続人に最低限保障されている相続分。兄弟姉妹にはない。","検認":"家庭裁判所が遺言書の状態を確認して記録する手続き。公正証書遺言と法務局保管の遺言は不要。","代償分割":"ある相続人が財産を受け取る代わりに、他の相続人にお金（代償金）を払う遺産分割の方法。","配偶者居住権":"夫や妻が亡くなった後も、残された配偶者が自宅に住み続けられる権利。","相続時精算課税":"60歳以上の親・祖父母から18歳以上の子・孫への贈与で選べる制度。年110万円の基礎控除＋累計2,500万円まで非課税で、相続時に精算。","小規模宅地等の特例":"自宅や事業用の土地の相続税評価額を大きく減らせる特例（自宅は330㎡まで80％減）。","貸家建付地":"自分の土地に建てたアパートなどを貸している場合の土地。借家人の権利の分だけ評価が下がる。","配当還元方式":"同族株主以外が取得した非上場株式の評価方法。配当金額をもとに評価する。","類似業種比準方式":"似た業種の上場会社の株価と、配当・利益・純資産を比べて非上場株式を評価する方法。","純資産価額方式":"会社の資産から負債を引いた純資産をもとに非上場株式を評価する方法。","任意後見":"判断能力があるうちに、将来の後見人と内容を公正証書の契約で決めておく制度。","特別寄与料":"相続人ではない親族が介護などで特別に貢献したとき、相続人に請求できるお金。","物納":"相続税をお金ではなく、不動産などの財産で納めること。"}}</script>

function weekKey(d){d=d?new Date(d+'T00:00:00'):new Date();const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function myScore(){const t=totals();const wk=weekKey();let wn=0,wc=0;for(const k in S.days){if(weekKey(k)===wk){wn+=S.days[k].n;wc+=S.days[k].c}}const st=streakInfo();return{correct:t.c,total:t.n,wk,wc,wn,streak:st.cur,ld:st.today?today():dayStr(new Date(Date.now()-864e5)),bc:earnedIds().length}}

/* ---------- 連続日数 ---------- */
const dayStr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function streakInfo(){
  const set=new Set(Object.keys(S.days).filter(k=>S.days[k].n>0));
  const d=new Date(); const doneToday=set.has(dayStr(d)); if(!doneToday) d.setDate(d.getDate()-1);
  let cur=0; while(set.has(dayStr(d))){cur++;d.setDate(d.getDate()-1)}
  let best=0,run=0,prev=null;
  [...set].sort().forEach(k=>{const t=new Date(k+'T00:00:00');run=(prev&&Math.round((t-prev)/864e5)===1)?run+1:1;if(run>best)best=run;prev=t});
  return {cur,best:Math.max(best,cur),today:doneToday};
}

/* ---------- 模試 ---------- */
const MOCK_TYPES={
  full2:{label:'2級 本番模試',lv:'2',per:10,min:120},
  mini2:{label:'2級 ミニ模試',lv:'2',per:4,min:48},
  lv1:{label:'1級 基礎編模試',lv:'1',per:5,min:90}
};
const PASS=0.6;
let mock=null, mockTick=null, mockQuit=false;
try{const t=localStorage.getItem(LS+'-mock');if(t)mock=JSON.parse(t)}catch(e){}
function saveMock(){try{mock?localStorage.setItem(LS+'-mock',JSON.stringify(mock)):localStorage.removeItem(LS+'-mock')}catch(e){}}
function startMock(kind){
  const T=MOCK_TYPES[kind];
  const items=[].concat(...FIELDS.map(f=>shuffle(Q.filter(q=>q.field===f&&q.lv===T.lv)).slice(0,T.per).map(q=>q.id)));
  mock={kind,items,sel:{},pos:0,start:Date.now(),limit:T.min*60000,result:null};
  mockQuit=false; saveMock(); go('mock');
}
function mockLeft(){return mock?Math.max(0,mock.start+mock.limit-Date.now()):0}
const fmtMs=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+pad(s%60)};
function gradeMock(){
  if(!mock||mock.result) return;
  const fs={}, sc=[0,0], marks=[];
  mock.items.forEach((id,i)=>{
    const q=QBY[id]; const you=(mock.sel[i]||[]).map(x=>x+1).sort((a,b)=>a-b);
    const ok=you.join()===q.ans.slice().sort((a,b)=>a-b).join();
    const f=fs[q.field]||(fs[q.field]=[0,0]); f[1]++; sc[1]++; if(ok){f[0]++; sc[0]++}
    marks.push(ok?1:0);
    if(!you.length) return;
    const r=S.mcq[id]||{n:0,c:0}; r.n++; if(ok) r.c++; r.last=ok; r.at=today(); S.mcq[id]=r;
    const d=S.days[today()]||{n:0,c:0}; d.n++; if(ok) d.c++; S.days[today()]=d;
  });
  const pass=sc[0]>=Math.ceil(sc[1]*PASS);
  const mins=Math.min(Math.ceil((Date.now()-mock.start)/60000),mock.limit/60000);
  mock.result={sc,fs,pass,mins,marks};
  S.mocks=(S.mocks||[]).concat([{at:today(),kind:mock.kind,sc,fs,pass,mins}]);
  saveMock(); persist(); updateBadge(); sendScore(); checkBadges();
}
function lsLoad(){try{const t=localStorage.getItem(LS);return t?JSON.parse(t):null}catch(e){return null}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function importHistory(){
  if(S.imported) return;
  for(const k in HISTORY){
    const [m,d]=k.split('-'); const date='2026-'+pad(m)+'-'+pad(d);
    const day=S.days[date]||{n:0,c:0}; day.n++; if(HISTORY[k]) day.c++; S.days[date]=day;
  }
  S.imported=true;
}
async function persist(){
  lsSave();
  if(!store) return;
  if(saving){dirty=true;return}
  saving=true;
  try{do{dirty=false;await store.set(JSON.parse(JSON.stringify(S)))}while(dirty);setSync('保存済み')}
  catch(e){setSync('この端末にだけ保存中')}
  saving=false;
}
function setSync(t){document.getElementById('sync').textContent=t}
function record(kind,id,ok){
  const map=kind==='mcq'?S.mcq:S.ox;
  const r=map[id]||{n:0,c:0}; r.n++; if(ok) r.c++; r.last=ok; r.at=today(); map[id]=r;
  const d=S.days[today()]||{n:0,c:0}; d.n++; if(ok) d.c++; S.days[today()]=d;
  persist(); updateBadge(); sendScore(); checkBadges();
}
function totals(){
  let n=0,c=0; for(const k in S.days){n+=S.days[k].n;c+=S.days[k].c} return {n,c};
}
function kindTotals(map){let n=0,c=0;for(const k in map){n+=map[k].n;c+=map[k].c}return{n,c}}
function missList(){
  const out=[];
  for(const id in S.mcq) if(S.mcq[id].last===false && QBY[id]) out.push({kind:'mcq',id,at:S.mcq[id].at});
  for(const id in S.ox) if(S.ox[id].last===false){const [qid,i]=id.split('#'); if(QBY[qid]) out.push({kind:'ox',id,qid,i:+i,at:S.ox[id].at})}
  return out.sort((a,b)=>(b.at||'').localeCompare(a.at||''));
}

function buildItems(onlyMiss){
  let items=[];
  if(onlyMiss){items=missList().filter(m=>m.kind===cfg.mode).map(m=>m.kind==='mcq'?{kind:'mcq',id:m.id}:{kind:'ox',id:m.id,qid:m.qid,i:m.i})}
  else{
    const qs=Q.filter(q=>(cfg.lv==='all'||q.lv===cfg.lv)&&(cfg.field==='all'||(cfg.field==='weak'?q.weak:q.field===cfg.field)));
    if(cfg.mode==='mcq') items=qs.map(q=>({kind:'mcq',id:q.id}));
    else qs.forEach(q=>q.opts.forEach((_,i)=>items.push({kind:'ox',id:q.id+'#'+i,qid:q.id,i})));
  }
  if(cfg.order==='random') items=shuffle(items);
  if(!onlyMiss && cfg.count) items=items.slice(0,cfg.count);
  return items;
}

  const q=QBY[it.kind==='mcq'?it.id:it.qid];
  const head=`<div class="qhead"><span>${sess.label?esc(sess.label)+' ・ ':''}${sess.pos+1} / ${sess.items.length}</span><span><span class="chip">${q.lv}級・${esc(FSHORT[q.field]||q.field)}</span> ${q.weak?'<span class="chip date">苦手</span>':''}</span></div>
   <div class="progress"><i style="width:${sess.pos/sess.items.length*100}%"></i></div>`;

function nextBtns(){

}

function renderMcq(q,head){
  const need=q.ans.length;
  if(!sess.answered){
    view.innerHTML=`<div class="stack fade">${head}
     <p class="stem">${stemOf(q)}</p>
     <ul class="opts">${q.opts.map((o,i)=>`<li><div class="opt" role="button" tabindex="0" data-i="${i}" aria-pressed="${sess.sel.includes(i)}"><span class="n">${i+1}</span><span>${esc(o)}</span></div></li>`).join('')}</ul>
     <button class="btn" id="check" ${sess.sel.length===need?'':'disabled'}>答え合わせ</button>
    </div>`;
    view.querySelectorAll('.opt').forEach(b=>{
      const tog=e=>{if(e.target.closest('.term'))return;const i=+b.dataset.i;const k=sess.sel.indexOf(i);if(k>=0)sess.sel.splice(k,1);else{if(sess.sel.length>=need)sess.sel.shift();sess.sel.push(i)}renderQuiz()};
      b.addEventListener('click',tog);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog(e)}});
    });
    view.querySelector('#check').addEventListener('click',()=>{
      const you=sess.sel.map(i=>i+1).sort();const ok=you.join()===q.ans.slice().sort().join();
      sess.answered=true;sess.lastOk=ok;if(ok)sess.score++;record('mcq',q.id,ok);renderQuiz();window.scrollTo(0,0);
    });
    return;
  }
  const you=sess.sel.map(i=>i+1).sort((a,b)=>a-b);
  view.innerHTML=`<div class="stack fade">${head}
   <div class="verdict">あなた：${you.join('と')} → ${sess.lastOk?'<span class="v-ok">⭕ 正解</span>':'<span class="v-ng">❌ 不正解</span>'}　正解：${q.ans.join('と')}</div>
   <p class="stem" style="margin:0">${stemOf(q)}</p>
   <div class="stack" style="gap:8px">${q.opts.map((o,i)=>optRes(q,i,you.includes(i+1))).join('')}</div>
   ${q.point?'<div class="point"><b>覚えるポイント</b><br>'+hl(q.point)+'</div>':''}
   <p class="note" style="margin:0">黄色いマーカーの言葉をタップすると解説が出ます。</p>
   ${nextBtns()}</div>`;
  bindNext();
}

    view.innerHTML=`<div class="stack fade">${head}

    const k=b.dataset.all;start(missList().filter(m=>m.kind===k).map(m=>m.kind==='mcq'?{kind:'mcq',id:m.id}:{kind:'ox',id:m.id,qid:m.qid,i:m.i}),'間違えた問題');
  }));
}

function chartSvg(days){
  const W=360,H=200,L=34,R=6,T=20,B=26; const n=days.length; const bw=(W-L-R)/Math.max(n,1);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="日ごとの正答率">`;
  [0,50,100].forEach(v=>{const y=T+(H-T-B)*(1-v/100);s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-4}" y="${y+3}" text-anchor="end">${v}%</text>`});
  days.forEach((d,i)=>{const p=pct(d.c,d.n);const h=(H-T-B)*p/100;const x=L+i*bw+bw*.18;const w=bw*.64;const y=T+(H-T-B)-h;
    s+=`<rect class="b" x="${x}" y="${y}" width="${w}" height="${Math.max(h,1)}" rx="3"/>`;
    if(n<=10) s+=`<text class="lbl" x="${x+w/2}" y="${y-4}" text-anchor="middle">${p}</text>`;
    if(n<=7||i%2===(n-1)%2) s+=`<text x="${x+w/2}" y="${H-10}" text-anchor="middle">${esc(d.k.slice(5).replace('-','/').replace(/^0/,''))}</text>`});
  return s+'</svg>';
}
function renderStats(){
  const t=totals(), m=kindTotals(S.mcq), o=kindTotals(S.ox);

  const recent=days.slice(-14);
